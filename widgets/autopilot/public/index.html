<html>
  <head>
    <style>
      .ap { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .ap-title { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ap-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
      .ap-chip { font-size: 0.8em; padding: 2px 8px; border-radius: 999px; background: rgba(127, 127, 127, 0.15); }
      .ap-chip.quiet { background: transparent; border: 1px solid rgba(127, 127, 127, 0.4); opacity: 0.75; }
      .ap-status { text-wrap: balance; margin: 12px 0 0; font-size: 1.35em; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
      .ap-now { color: var(--ap-indoor); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .ap-reason { margin: 4px 0 0; opacity: 0.85; }
      .ap-detail { margin-top: 2px; opacity: 0.65; }
      .ap-chart { display: block; margin-top: 14px; overflow: visible; }
      .ap-chart text { font-size: 11px; fill: currentColor; opacity: 0.75; }
      .ap-chart text.axis-title { font-size: 10.5px; opacity: 0.6; }
      .ap-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8em; opacity: 0.9; margin-top: 10px; }
      .ap-key { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
      .ap-key.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
      .ap-foot { margin: 8px 0 0; font-size: 0.8em; opacity: 0.75; }
      .ap-empty { opacity: 0.8; margin: 12px 0; }
      /* Light values meet 3:1 or better on white; dark values are the brighter originals. The theme is
         read from the text colour Homey gives the page (see applyTheme), with the media query as the start. */
      :root { --ap-indoor: #c4580d; --ap-offset: #2d6bd6; --ap-solar: #d46a00; --ap-surplus: rgba(212, 106, 0, 0.18); --ap-grid: #2d6bd6;
        --ap-price-line: rgba(127, 127, 127, 0.9); --ap-price-top: rgba(127, 127, 127, 0.3); }
      :root[data-theme="dark"] { --ap-indoor: #e8833a; --ap-offset: #4da3ff; --ap-solar: #ff9f0a; --ap-surplus: rgba(255, 159, 10, 0.22); --ap-grid: #4da3ff; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --ap-indoor: #e8833a; --ap-offset: #4da3ff; --ap-solar: #ff9f0a; --ap-surplus: rgba(255, 159, 10, 0.22); --ap-grid: #4da3ff; }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="ap" id="ap"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function nums(list) { return list.filter(function (v) { return typeof v === 'number'; }); }
      function fmt(v, decimals) { return (Math.round(v * 100) / 100).toFixed(decimals); }

      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }

      // The chart is drawn at its real pixel width, so its text stays 11 px on any card.
      function chartWidth() {
        var ap = document.getElementById('ap'), cs = getComputedStyle(ap);
        return Math.max(240, Math.floor(ap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
      }

      // A smooth curve through points, monotone cubic (no overshoot), as on the help pages.
      function monotone(pts) {
        var n = pts.length;
        if (!n) return '';
        var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
        if (n < 2) return d;
        var dx = [], m = [], s = [], i;
        for (i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
        s[0] = m[0]; s[n - 1] = m[n - 2];
        for (i = 1; i < n - 1; i++) s[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
        for (i = 0; i < n - 1; i++) {
          if (m[i] === 0) { s[i] = 0; s[i + 1] = 0; continue; }
          var a = s[i] / m[i], b = s[i + 1] / m[i], h = a * a + b * b;
          if (h > 9) { var tau = 3 / Math.sqrt(h); s[i] = tau * a * m[i]; s[i + 1] = tau * b * m[i]; }
        }
        for (i = 0; i < n - 1; i++)
          d += 'C' + (pts[i][0] + dx[i] / 3).toFixed(1) + ' ' + (pts[i][1] + s[i] * dx[i] / 3).toFixed(1) + ' '
            + (pts[i + 1][0] - dx[i] / 3).toFixed(1) + ' ' + (pts[i + 1][1] - s[i + 1] * dx[i] / 3).toFixed(1) + ' '
            + pts[i + 1][0].toFixed(1) + ' ' + pts[i + 1][1].toFixed(1);
        return d;
      }
      // Runs of consecutive slots that have a value: [[first, last], ...].
      function runs(slots, pick) {
        var out = [], from = -1;
        slots.forEach(function (s, k) {
          var has = typeof pick(s) === 'number';
          if (has && from < 0) from = k;
          if (!has && from >= 0) { out.push([from, k - 1]); from = -1; }
        });
        if (from >= 0) out.push([from, slots.length - 1]);
        return out;
      }

      // The top of a chart is a header band with two rows: the axis titles (small, muted) above their
      // axes, and under them the word for the next day. Nothing in it sits on a bar or a line.
      var TOP = 40;
      function header(svg, data, x, W, L, R, B) {
        if (data.axes && data.axes.left) svg.appendChild(svgEl('text', {x: 0, y: 11, class: 'axis-title'}, data.axes.left));
        if (data.axes && data.axes.right) svg.appendChild(svgEl('text', {x: W, y: 11, class: 'axis-title', 'text-anchor': 'end'}, data.axes.right));
        if (!data.dayBreak) return;
        var bx = x(data.dayBreak.at);
        svg.appendChild(svgEl('line', {x1: bx, x2: bx, y1: TOP - 8, y2: B, stroke: 'currentColor', 'stroke-opacity': 0.3, 'stroke-dasharray': '2 3'}));
        var room = R - bx > data.dayBreak.label.length * 6.4 + 8;
        svg.appendChild(svgEl('text', {x: room ? bx + 5 : bx - 5, y: TOP - 12, 'text-anchor': room ? 'start' : 'end'}, data.dayBreak.label));
      }

      // The hours under a chart. An hour never touches its neighbour: text is about 6.2 px a character.
      function hours(svg, ticks, y) {
        var CHAR = 6.2, edge = -1e9;
        ticks.forEach(function (t) {
          var half = t.label.length * CHAR / 2;
          if (t.x - half < edge + 8) return;
          svg.appendChild(svgEl('text', {x: t.x, y: y, 'text-anchor': 'middle'}, t.label));
          edge = t.x + half;
        });
      }

      // Heating: indoor °C on the left axis (measured solid, expected dashed), the
      // BT1 shift on the right axis as one solid bar an hour from 0, and a line at now.
      function heatingChart(data) {
        var W = chartWidth(), L = 34, R = W - 40, PH = Math.max(110, Math.min(170, Math.round(W * 0.36))), B = TOP + PH, H = B + 24;
        var n = data.slots.length, step = (R - L) / n;
        var svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'ap-chart', role: 'img'});
        var left = data.scale.left, right = data.scale.right;
        var yi = function (v) { return B - PH * (v - left.lo) / (left.hi - left.lo); };
        var yo = function (v) { return B - PH * (v - right.lo) / (right.hi - right.lo); };
        var x = function (k) { return L + k * step; };

        left.ticks.forEach(function (v) {
          svg.appendChild(svgEl('line', {x1: L, x2: R, y1: yi(v), y2: yi(v), stroke: 'currentColor', 'stroke-opacity': 0.1}));
          svg.appendChild(svgEl('text', {x: L - 5, y: yi(v) + 4, 'text-anchor': 'end'}, fmt(v, left.decimals)));
        });
        right.ticks.forEach(function (v) {
          svg.appendChild(svgEl('text', {x: R + 5, y: yo(v) + 4}, (v > 0 ? '+' : '') + fmt(v, right.decimals)));
        });
        svg.appendChild(svgEl('line', {x1: L, x2: R, y1: yo(0), y2: yo(0), stroke: 'currentColor', 'stroke-opacity': 0.25, 'stroke-width': 0.8}));

        // Shift: one solid, slightly rounded bar an hour with a gap between them; the plan is lighter.
        (data.bars || []).forEach(function (b) {
          var y0 = yo(0), y1 = yo(b.value), h = Math.max(Math.abs(y1 - y0), 2);
          svg.appendChild(svgEl('rect', {x: x(b.at) + 1.5, width: Math.max((b.to - b.at) * step - 3, 2), y: b.value > 0 ? y0 - h : y0, height: h, rx: 2.5,
            fill: 'var(--ap-offset)', 'fill-opacity': b.at >= data.now ? 0.4 : 0.9}));
        });

        // Indoor: measured up to now, expected after, both smooth.
        function curve(from, to) {
          var pts = [];
          for (var k = from; k < to; k++) {
            var v = data.slots[k] && data.slots[k].indoor;
            if (typeof v === 'number') pts.push([x(k) + step / 2, yi(v)]);
          }
          return monotone(pts);
        }
        var past = curve(0, data.now), ahead = curve(data.now - 1, n);
        if (past) svg.appendChild(svgEl('path', {d: past, fill: 'none', stroke: 'var(--ap-indoor)', 'stroke-width': 2.2, 'stroke-linecap': 'round'}));
        if (ahead) svg.appendChild(svgEl('path', {d: ahead, fill: 'none', stroke: 'var(--ap-indoor)', 'stroke-width': 2, 'stroke-dasharray': '4 4', 'stroke-linecap': 'round'}));

        svg.appendChild(svgEl('line', {x1: x(data.now), x2: x(data.now), y1: TOP - 8, y2: B, stroke: 'currentColor', 'stroke-opacity': 0.4}));
        header(svg, data, x, W, L, R, B);
        hours(svg, data.ticks.map(function (t) { return {x: x(t.at), label: t.label}; }), H - 6);
        return svg;
      }

      var clips = 0;
      // Hot water: the price as a smooth curve over a soft fade (left axis), the expected solar surplus
      // as a light warm area (right axis, kW), and each planned charge as a real band on the time axis
      // from its start to its end, split inside into the solar part (solid warm) and the grid part (blue).
      function hotwaterChart(data) {
        var W = chartWidth(), L = 34, R = W - (data.scale.right ? 34 : 6), PH = Math.max(100, Math.min(150, Math.round(W * 0.33))), B = TOP + PH;
        var bands = data.bands || [], tickY = bands.length ? B + 56 : B + 18, H = tickY + 6;
        var n = data.slots.length, step = (R - L) / n;
        var svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'ap-chart', role: 'img'});
        var left = data.scale.left, right = data.scale.right;
        var yp = function (v) { return B - PH * (v - left.lo) / (left.hi - left.lo); };
        var ys = function (v) { return B - PH * (v - right.lo) / (right.hi - right.lo); };
        var x = function (k) { return L + k * step; };
        var fade = 'apfade' + (++clips);
        svg.appendChild(svgEl('defs', {})).innerHTML = '<linearGradient id="' + fade + '" x1="0" y1="0" x2="0" y2="1">'
          + '<stop offset="0" stop-color="var(--ap-price-top)"/><stop offset="1" stop-color="var(--ap-price-top)" stop-opacity="0"/></linearGradient>';
        left.ticks.forEach(function (v) {
          svg.appendChild(svgEl('line', {x1: L, x2: R, y1: yp(v), y2: yp(v), stroke: 'currentColor', 'stroke-opacity': 0.1}));
          svg.appendChild(svgEl('text', {x: L - 5, y: yp(v) + 4, 'text-anchor': 'end'}, fmt(v, left.decimals)));
        });
        if (right) right.ticks.forEach(function (v) {
          svg.appendChild(svgEl('text', {x: R + 5, y: ys(v) + 4}, fmt(v, right.decimals)));
        });
        // Surplus first, so the price curve and the bands sit on top of it.
        if (right) {
          var pts = data.slots.map(function (s, k) { return [x(k) + step / 2, ys(s.surplus || 0)]; });
          svg.appendChild(svgEl('path', {d: monotone(pts) + 'L' + pts[pts.length - 1][0].toFixed(1) + ' ' + B + 'L' + pts[0][0].toFixed(1) + ' ' + B + 'Z', fill: 'var(--ap-surplus)'}));
        }
        // Price: each run of known prices is a smooth curve with a soft fade under it. Hours with no known
        // price stay empty.
        runs(data.slots, function (s) { return s.price; }).forEach(function (r) {
          var p = [];
          for (var k = r[0]; k <= r[1]; k++) p.push([x(k) + step / 2, yp(data.slots[k].price)]);
          var line = monotone(p);
          svg.appendChild(svgEl('path', {d: line + 'L' + p[p.length - 1][0].toFixed(1) + ' ' + B + 'L' + p[0][0].toFixed(1) + ' ' + B + 'Z', fill: 'url(#' + fade + ')'}));
          svg.appendChild(svgEl('path', {d: line, fill: 'none', stroke: 'var(--ap-price-line)', 'stroke-width': 2, 'stroke-linecap': 'round'}));
        });
        // Charge bands: a rounded band from start to end, 14 px tall, with its time range under it.
        var edge = L - 100;
        bands.forEach(function (b) {
          var bx = x(b.from), bw = Math.max(x(b.to) - bx, 6), by = B + 10, bh = 14, sw = bw * b.solar, id = 'apclip' + (++clips);
          svg.appendChild(svgEl('defs', {})).innerHTML = '<clipPath id="' + id + '"><rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="5"/></clipPath>';
          var g = svgEl('g', {'clip-path': 'url(#' + id + ')'});
          g.appendChild(svgEl('rect', {x: bx, y: by, width: bw, height: bh, fill: 'var(--ap-grid)'}));
          if (sw > 0) g.appendChild(svgEl('rect', {x: bx, y: by, width: sw, height: bh, fill: 'var(--ap-solar)'}));
          svg.appendChild(g);
          var half = b.label.length * 3.1, cx = Math.min(R - half, Math.max(L + half, bx + bw / 2));
          if (cx - half < edge + 8) return;
          svg.appendChild(svgEl('text', {x: cx, y: by + bh + 14, 'text-anchor': 'middle'}, b.label));
          edge = cx + half;
        });
        header(svg, data, x, W, L, R, B);
        hours(svg, data.ticks.map(function (t) { return {x: x(t.at), label: t.label}; }), tickY);
        return svg;
      }

      function legend(items) {
        var box = el('div', 'ap-legend');
        items.forEach(function (i) {
          if (!i.text) return;
          var item = el('span'); var key = el('span', 'ap-key' + (i.line ? ' line' : ''));
          key.style.cssText = i.style;
          item.appendChild(key); item.appendChild(document.createTextNode(i.text)); box.appendChild(item);
        });
        return box;
      }

      var last = null;
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('ap').scrollHeight) + 16);
      }

      function render(data) {
        applyTheme();
        var root = document.getElementById('ap');
        root.replaceChildren();
        if (data.title) root.appendChild(el('div', 'ap-title homey-text-small', data.title));
        var chips = (data.chips || []).slice();
        if (!data.empty && (chips.length || data.badge)) {
          var row = el('div', 'ap-chips');
          chips.forEach(function (c) { row.appendChild(el('span', 'ap-chip', c)); });
          if (data.badge) row.appendChild(el('span', 'ap-chip quiet', data.badge));
          root.appendChild(row);
        }
        if (data.empty) { root.appendChild(el('p', 'ap-empty', data.empty)); return; }
        if (data.status) {
          var status = el('p', 'ap-status');
          status.appendChild(el('span', '', data.status));
          if (typeof data.indoorNow === 'number') status.appendChild(el('span', 'ap-now', data.indoorNow.toFixed(1) + ' °C'));
          root.appendChild(status);
        }
        if (data.reason) root.appendChild(el('p', 'ap-reason homey-text-small', data.reason));
        if (data.detail) root.appendChild(el('p', 'ap-reason homey-text-small ap-detail', data.detail));
        if (data.kind === 'heating' && data.slots.length) {
          root.appendChild(heatingChart(data));
          root.appendChild(legend([
            {text: data.legend.indoor, line: true, style: 'background: var(--ap-indoor);'},
            {text: data.legend.planned, line: true, style: 'background: repeating-linear-gradient(90deg, var(--ap-indoor) 0 4px, transparent 4px 7px);'},
            {text: data.legend.offset, style: 'background: var(--ap-offset);'},
          ]));
        } else if (data.kind === 'hotwater' && data.slots.length) {
          root.appendChild(hotwaterChart(data));
          root.appendChild(legend([
            {text: data.legend.price, style: 'border-top: 2px solid var(--ap-price-line); background: linear-gradient(to bottom, var(--ap-price-top), transparent);'},
            {text: data.legend.surplus, style: 'background: var(--ap-surplus);'},
            {text: data.legend.solar, style: 'background: var(--ap-solar);'}, {text: data.legend.grid, style: 'background: var(--ap-grid);'}]));
        }
        if (data.hint) root.appendChild(el('p', 'ap-foot', data.hint));
        if (data.footnote) root.appendChild(el('p', 'ap-foot', data.footnote));
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        document.getElementById('ap').appendChild(el('p', 'ap-empty', words().loading));
        function show(data) { last = data; render(data); fit(Homey); }
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              // The app answers its own problems with a translated line, so a rejection is the network.
              var text = words().error;
              document.getElementById('ap').replaceChildren(el('p', 'ap-empty', text));
              fit(Homey);
            });
        }
        load().finally(function () { Homey.ready(); });
        setInterval(load, 60000);
        // The card changes width: draw the chart again at the new width.
        var timer = null;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { if (last) { render(last); fit(Homey); } }, 150);
        });
      }
    </script>
  </body>
</html>
