<html>
  <head>
    <meta charset="utf-8">
    <style>
      /* Autopilot heating's first weeks in four steps (settling.ts): a labelled stepper, the step's
         headline, what it is waiting for and about when, then a line or two on what comes next.
         Blue links open the help page section that explains the step. Animations play only when
         the card first shows or its content changes, never on an unchanged refresh. */
      .gs { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .gs-title { opacity: 0.6; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gs-stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 8px; }
      .gs-st { display: grid; gap: 4px; font-size: 0.72em; min-width: 0; }
      .gs-track { height: 6px; border-radius: 99px; background: var(--gs-off); overflow: hidden; }
      .gs-fill { height: 100%; border-radius: 99px; transform-origin: left; transform: scaleX(var(--to, 0)); }
      .gs-st.done .gs-fill { background: var(--gs-good); }
      .gs-st.now .gs-fill, .gs-st.early .gs-fill { background: var(--gs-line); }
      .gs-st.live .gs-fill { background: var(--gs-target); }
      .gs-st span { opacity: 0.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
      .gs-st.done span { opacity: 0.7; }
      .gs-st.now span { opacity: 1; font-weight: 700; }
      .gs-st.early span { opacity: 0.8; }
      .gs-st.live span { opacity: 1; font-weight: 700; color: var(--gs-target); }
      .gs-tick { width: 10px; height: 10px; flex: none; }
      .gs-tick path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 0; }
      .gs-saving { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.85em; font-weight: 600; color: var(--gs-target); }
      .gs-saving i { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--gs-target); flex: none; }
      .gs-saving i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--gs-target); opacity: 0; }
      .gs-big { margin-top: 12px; font-size: 1.5em; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
      .gs-saving + .gs-big { margin-top: 2px; }
      .gs-of { font-size: 0.55em; font-weight: 600; opacity: 0.6; margin-left: 4px; }
      .gs-desc { margin-top: 2px; font-size: 0.88em; opacity: 0.8; line-height: 1.35; }
      .gs-wait { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--gs-box); display: grid; gap: 6px; }
      .gs-wait-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .gs-wait-h { font-size: 0.75em; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.55; }
      .gs-wait-t { font-size: 0.95em; font-weight: 600; line-height: 1.3; }
      .gs-wait-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.85em; }
      .gs-pips { display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
      .gs-pip { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gs-line); box-sizing: border-box; }
      .gs-pip.on { background: var(--gs-good); border-color: var(--gs-good); }
      .gs-pips em { font-style: normal; opacity: 0.7; margin-left: 2px; }
      .gs-eta { opacity: 0.7; white-space: nowrap; }
      .gs-bar { height: 6px; border-radius: 99px; background: var(--gs-off); overflow: hidden; flex: 1; }
      .gs-bar b { display: block; height: 100%; background: var(--gs-line); border-radius: 99px; transform-origin: left; transform: scaleX(var(--to, 0)); }
      .gs-line { margin-top: 8px; font-size: 0.85em; line-height: 1.35; display: grid; grid-template-columns: 3.6em 1fr; gap: 6px; }
      .gs-line > span:first-child { opacity: 0.55; }
      .gs-foot { margin-top: 10px; font-size: 0.82em; opacity: 0.6; }
      .gs-help { margin-top: 10px; font-size: 0.82em; }
      a.gs-link { color: var(--gs-target); font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; }
      .gs-wait-top a.gs-link { font-size: 0.8em; }
      .gs-chart { display: block; width: 100%; margin-top: 8px; overflow: visible; }
      .gs-empty { opacity: 0.8; margin: 12px 0; }
      :root { --gs-good: #248a3d; --gs-line: #e8833a; --gs-target: #3d7be0; --gs-off: #e5e5ea; --gs-box: rgba(127, 127, 127, 0.10); --gs-glow: rgba(232, 131, 58, 0.45); --gs-glow-0: rgba(232, 131, 58, 0); }
      :root[data-theme="dark"] { --gs-good: #30d158; --gs-line: #f0954f; --gs-target: #6ea0ff; --gs-off: #3a3a3c; --gs-box: rgba(127, 127, 127, 0.16); --gs-glow: rgba(240, 149, 79, 0.5); --gs-glow-0: rgba(240, 149, 79, 0); }
      @media (prefers-color-scheme: dark) {

      }

        .gs-pip.next { animation: gs-breathe 2600ms ease-in-out 1200ms infinite; }
        .gs-saving i::after { animation: gs-ripple 2400ms ease-out 900ms infinite; }
        /* Once, when the content changed. */
        .gs.play .gs-st .gs-fill { animation: gs-grow 520ms cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 140ms + 100ms); }
        .gs.play .gs-st.live .gs-fill { animation: gs-grow 700ms cubic-bezier(.2, .7, .2, 1) both, gs-glow 1200ms ease-out 1 both; animation-delay: calc(var(--i) * 140ms + 100ms), calc(var(--i) * 140ms + 700ms); }
        .gs.play .gs-tick path { animation: gs-draw 360ms ease-out both; animation-delay: calc(var(--i) * 140ms + 420ms); }
        .gs.play .gs-big, .gs.play .gs-desc, .gs.play .gs-wait, .gs.play .gs-line, .gs.play .gs-foot, .gs.play .gs-help { animation: gs-rise 420ms cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--d, 0) * 1ms); }
        .gs.play .gs-pip { animation: gs-in 260ms ease-out both; animation-delay: calc(var(--d) * 1ms); }
        .gs.play .gs-pip.on { animation: gs-in 420ms cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: calc(var(--d) * 1ms); }
        .gs.play .gs-pip.next { animation: gs-in 260ms ease-out both, gs-breathe 2600ms ease-in-out infinite; animation-delay: calc(var(--d) * 1ms), calc(var(--d) * 1ms + 400ms); }
        .gs.play .gs-bar b { animation: gs-grow 900ms cubic-bezier(.2, .7, .2, 1) 700ms both; }
        .gs.play .gs-wait.you { animation: gs-rise 420ms cubic-bezier(.2, .7, .2, 1) both, gs-ring 1400ms ease-out 1; animation-delay: calc(var(--d) * 1ms), calc(var(--d) * 1ms + 500ms); }
        .gs.play .gs-chart .ln { animation: gs-draw-line 1100ms cubic-bezier(.4, 0, .2, 1) 650ms both; }
        .gs.play .gs-chart .dt { animation: gs-in 220ms ease-out both; animation-delay: calc(650ms + var(--k) * 1100ms / var(--n)); }
        .gs.play .gs-chart .proj { animation: gs-fade 500ms ease-out 1800ms both; }
        .gs.play .gs-chart .end { animation: gs-fade 500ms ease-out 1800ms both, gs-end 1200ms ease-out 2300ms 1; transform-box: fill-box; transform-origin: center; }
        .gs.play .gs-chart .band { animation: gs-fade 500ms ease-out 450ms both; }
      }
      @keyframes gs-grow { from { transform: scaleX(0); } to { transform: scaleX(var(--to, 1)); } }
      @keyframes gs-draw { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
      @keyframes gs-draw-line { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
      @keyframes gs-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes gs-in { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: none; } }
      @keyframes gs-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes gs-breathe { 0%, 100% { box-shadow: 0 0 0 0 var(--gs-glow); } 50% { box-shadow: 0 0 0 5px var(--gs-glow-0); } }
      @keyframes gs-ripple { 0% { opacity: .5; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(3.2); } }
      @keyframes gs-ring { 0% { box-shadow: 0 0 0 0 var(--gs-glow); } 100% { box-shadow: 0 0 0 10px var(--gs-glow-0); } }
      @keyframes gs-glow { 0% { filter: brightness(1.5); } 100% { filter: none; } }
      @keyframes gs-end { 0% { transform: scale(1); } 40% { transform: scale(1.7); } 100% { transform: scale(1); } }
    </style>
  </head>

  <body class="homey-widget">
    <div class="gs" id="gs"></div>

          var kept = JSON.parse(localStorage.getItem(cacheKey) || 'null');
          if (kept && kept.data && kept.data.steps && Date.now() - kept.at < KEEP_MS) { last = kept.data; shownSig = JSON.stringify(kept.data); render(kept.data, false); Homey.ready({height: Math.ceil(document.getElementById('gs').scrollHeight) + 16}); shown = true; }
        } catch (e) { /* no storage: wait for the app, as before */ }
        load().finally(function () { if (!shown) Homey.ready({height: Math.ceil(document.getElementById('gs').scrollHeight) + 16}); });
        // A new day comes in each morning: an hourly refresh is plenty.
        setInterval(function () { if (!last || last.loading || last.empty) load(); }, 30000);
        setInterval(load, 60 * 60000);
      }
    </script>
  </body>
</html>
