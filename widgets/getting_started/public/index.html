<html>
  <head>
    <meta charset="utf-8">
    <style>
      /* Autopilot Setup: Autopilot heating's first weeks (settling.ts) as a story. One line says
         what is happening, one says whether it is going as expected and when it is done, and the
         graph walks the days to the target and on to Done. One link to the help section. The
         line draws when the card first shows or its content changes, never on a plain refresh. */
      .gs { padding: var(--homey-su-3, 12px) var(--homey-su-4, 16px); }
      /* Type: four sizes. Header 0.85/0.75 em, headline 1.125 em, status 0.9 em, body and
         links 0.8 em. Space on a 4 px step: 2 inside a pair, 8 inside the story, 12-16 between
         blocks. Headline, status and why read as one group; the graph and help link stand apart. */
      .gs-title { font-size: 0.85em; opacity: 0.6; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .gs-step { font-size: 0.75em; opacity: 0.5; margin-top: 2px; }
      .gs-big { margin-top: 12px; font-size: 1.125em; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
      .gs-status { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.9em; font-weight: 600; line-height: 1.3; }
      .gs-status i { position: relative; width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; opacity: 0.4; }
      /* Muted by colour, not opacity: the rise animation ends at opacity 1 and would undo it, and
         an inline link keeps its full colour. */
      .gs-why { margin: 2px 0 0 16px; font-size: 0.8em; color: color-mix(in srgb, currentColor 70%, transparent); line-height: 1.4; }
      /* Older web views (before iOS 16.2): muted by opacity instead. */
      @supports not (color: color-mix(in srgb, red 50%, transparent)) { .gs-why { opacity: 0.75; } }
      .gs-status.good i { background: var(--gs-good); opacity: 1; }
      .gs-status.warn i { background: var(--gs-warn); opacity: 1; }
      .gs-help { margin-top: 12px; font-size: 0.8em; }
      a.gs-link { color: var(--gs-target); font-weight: 600; text-decoration: none; cursor: pointer; }
      .gs-chart { display: block; width: 100%; margin-top: 16px; overflow: visible; }
      .gs-empty { opacity: 0.8; margin: 12px 0; }
      :root { --gs-good: #248a3d; --gs-warn: #b4500c; --gs-line: #e8833a; --gs-target: #3d7be0; }
      :root[data-theme="dark"] { --gs-good: #30d158; --gs-warn: #ff9f0a; --gs-line: #f0954f; --gs-target: #6ea0ff; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --gs-good: #30d158; --gs-warn: #ff9f0a; --gs-line: #f0954f; --gs-target: #6ea0ff; }
      }
      @media (prefers-reduced-motion: no-preference) {
        /* Once, when the content changed: the words rise in turn, the line draws, then Done. */
        .gs.play .gs-big, .gs.play .gs-status, .gs.play .gs-why { animation: gs-rise 420ms cubic-bezier(.2, .7, .2, 1) both; }
        .gs.play .gs-status { animation-delay: 120ms; }
        .gs.play .gs-why { animation-delay: 220ms; }
        .gs.play .gs-chart .ln { animation: gs-draw 1100ms cubic-bezier(.4, 0, .2, 1) 300ms both; }
        .gs.play .gs-chart .proj { animation: gs-fade 500ms ease-out 1400ms both; }
        .gs.play .gs-chart .end { animation: gs-pop 520ms cubic-bezier(.3, 1.6, .5, 1) 1800ms both; transform-box: fill-box; transform-origin: center; }
        /* A new step: its label catches the eye once. */
        .gs.stepped .gs-step { animation: gs-flash 1600ms ease-out 1; }
        /* Only while the owner is asked to act: the dot keeps a soft pulse. */
        .gs-status.act i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--gs-warn); animation: gs-pulse 2400ms ease-out 600ms infinite; }
      }
      @keyframes gs-draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
      @keyframes gs-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes gs-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes gs-pop { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: none; } }
      @keyframes gs-flash { 0%, 30% { color: var(--gs-target); opacity: 1; } 100% { opacity: 0.5; } }
      @keyframes gs-pulse { 0% { opacity: 0.6; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(3); } }
    </style>
  </head>

  <body class="homey-widget">
    <div class="gs" id="gs"></div>

    <script type="text/javascript">
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }
      var last = null;
      var homey = null;
      var SVG = 'http://www.w3.org/2000/svg';
      var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      function svg(tag, attrs, text) {
        var n = document.createElementNS(SVG, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('gs').scrollHeight) + 16);
      }
      // The help section, in Homey's in-app browser.
      function link(help) {
        var a = el('a', 'gs-link', help.text + ' ›');
        a.href = help.url;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          if (homey && homey.popup) homey.popup(help.url);
        });
        return a;
      }
      // Each day's average against the thermostat, its band the range that counts as on target
      // (settling.ts SETTLED_K). The pace so far, carried on, is dashed to the day it is expected
      // in the band, marked Done. At least a week wide, so the first days don't fill the card.
      function chart(c) {
        var days = c.days, proj = c.projection ? c.projection.days : [], all = days.concat(proj), target = c.target;
        var W = 300, H = 92, n = Math.max(7, all.length);
        var values = all.map(function (d) { return d.mean; }).concat([target - 0.3, target + 0.3]);
        var lo = Math.min.apply(null, values) - 0.1, hi = Math.max.apply(null, values) + 0.1;
        var x = function (k) { return 20 + k * (W - 40) / (n - 1); };
        var y = function (v) { return H - 16 - (v - lo) / (hi - lo) * (H - 26); };
        var s = svg('svg', {viewBox: '0 0 ' + W + ' ' + H, class: 'gs-chart', 'aria-hidden': 'true'});
        s.appendChild(svg('rect', {x: 10, y: y(target + 0.2), width: W - 20, height: y(target - 0.2) - y(target + 0.2), rx: 4, fill: 'var(--gs-target)', opacity: 0.16}));
        s.appendChild(svg('line', {x1: 10, x2: W - 10, y1: y(target), y2: y(target), stroke: 'var(--gs-target)', 'stroke-dasharray': '4 4', opacity: 0.6}));
        var end = days.length - 1;
        if (proj.length) {
          var pts = [x(end) + ',' + y(days[end].mean)];
          proj.forEach(function (d, j) { pts.push(x(end + 1 + j) + ',' + y(d.mean)); });
          s.appendChild(svg('polyline', {class: 'proj', points: pts.join(' '), fill: 'none', stroke: 'var(--gs-line)', 'stroke-width': 2, 'stroke-dasharray': '3 4', opacity: 0.7}));
          var k = end + proj.length, last = proj[proj.length - 1];
          var g = svg('g', {class: 'end'});
          g.appendChild(svg('circle', {cx: x(k), cy: y(last.mean), r: 5, fill: 'var(--gs-good)'}));
          if (c.doneLabel) g.appendChild(svg('text', {x: x(k), y: Math.min(H - 20, y(last.mean) + 18), 'text-anchor': 'middle', 'font-size': 11, 'font-weight': 600, fill: 'var(--gs-good)'}, c.doneLabel));
          s.appendChild(g);
        }
        s.appendChild(svg('polyline', {class: 'ln', points: days.map(function (d, k) { return x(k) + ',' + y(d.mean); }).join(' '), fill: 'none', stroke: 'var(--gs-line)', 'stroke-width': 2.5, 'stroke-linejoin': 'round'}));
        days.forEach(function (d, k) { s.appendChild(svg('circle', {cx: x(k), cy: y(d.mean), r: 3.5, fill: 'var(--gs-line)'})); });
        var labels = svg('g', {fill: 'currentColor', opacity: 0.5, 'font-size': 11, 'text-anchor': 'middle'});
        var every = Math.ceil(n / 10);
        // Counted from the right, so the latest day is always named and the spacing stays even.
        all.forEach(function (d, k) { if ((all.length - 1 - k) % every === 0) labels.appendChild(svg('text', {x: x(k), y: H - 2}, d.label)); });
        s.appendChild(labels);
        return s;
      }
      var lastStep = null;
      function render(data, play) {
        applyTheme();
        var root = document.getElementById('gs');
        root.className = 'gs';
        root.replaceChildren();
        root.appendChild(el('div', 'gs-title', data.title || ''));
        if (data.empty || !data.big) { root.appendChild(el('p', 'gs-empty', data.empty || '')); return; }
        if (data.step) root.appendChild(el('div', 'gs-step', data.step));
        // A number and its unit stay on one line ("22.5 °C").
        root.appendChild(el('div', 'gs-big', data.big.replace(/(\d) (°|K\b)/g, '$1\u00a0$2')));
        if (data.status) {
          var st = el('div', 'gs-status' + (data.status.tone ? ' ' + data.status.tone : '') + (data.act ? ' act' : ''));
          st.append(el('i'), document.createTextNode(data.status.text));
          root.appendChild(st);
        }
        if (data.why) {
          var why = el('div', 'gs-why', data.why);
          if (data.action) { why.appendChild(document.createTextNode(' ')); why.appendChild(link(data.action)); }
          root.appendChild(why);
        }
        if (data.chart) {
          var c = chart(data.chart);
          root.appendChild(c);
          var ln = c.querySelector('.ln');
          if (play && !reduce && ln && ln.getTotalLength) {
            var L = Math.ceil(ln.getTotalLength());
            ln.style.setProperty('--len', L);
            ln.setAttribute('stroke-dasharray', L);
          }
        }
        if (data.help) { var h = el('div', 'gs-help'); h.appendChild(link(data.help)); root.appendChild(h); }
        // A step moved on since the card last showed one: say so once.
        var stepped = play && lastStep !== null && data.step && data.step !== lastStep;
        if (data.step) lastStep = data.step;
        if (play) { void root.offsetWidth; root.classList.add('play'); }
        if (stepped) root.classList.add('stepped');
      }

      function onHomeyReady(Homey) {
        homey = Homey;
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        // Widgets share one storage: the key names this one (its path) and the device it shows.
        var cacheKey = 'last:' + location.pathname + ':' + (device || ''), KEEP_MS = 3 * 3600000;
        function keep(data) {
          if (!data || data.loading || data.empty) return;
          try { localStorage.setItem(cacheKey, JSON.stringify({at: Date.now(), data: data})); } catch (e) { /* no storage */ }
        }
        document.getElementById('gs').appendChild(el('p', 'gs-empty', words().loading));
        function show(data) {
          // Starting (just after a restart): ask again in 5 s, not at the next refresh, and keep
          // the picture already shown meanwhile.
          if (data && data.loading && !soon) soon = setTimeout(function () { soon = null; load(); }, 5000);
          if (data && data.loading && last && !last.loading) return;
          // Animate only what is new: the first picture, or content that changed since the last.
          var sig = JSON.stringify(data), play = sig !== shownSig;
          failures = 0; last = data; shownSig = sig; render(data, play); fit(Homey); keep(data);
        }
        var soon = null;
        var shownSig = null;
        var failures = 0;
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              if (++failures < 5) { setTimeout(load, 30000); return; }
              document.getElementById('gs').replaceChildren(el('p', 'gs-empty', words().error));
              fit(Homey);
            });
        }
        // ready() without a height puts the widget back to its compose height: the fit done while
        // loading would be lost, and a long card clipped (the Plan vs actual widget, 2026-11-21).
        // The last picture this card showed, drawn at once while the app is asked: the dashboard
        // opens without waiting on the app, and the answer replaces it a moment later.
        var shown = false;
        try {
          var kept = JSON.parse(localStorage.getItem(cacheKey) || 'null');
          if (kept && kept.data && kept.data.status && Date.now() - kept.at < KEEP_MS) { last = kept.data; shownSig = JSON.stringify(kept.data); render(kept.data, false); Homey.ready({height: Math.ceil(document.getElementById('gs').scrollHeight) + 16}); shown = true; }
        } catch (e) { /* no storage: wait for the app, as before */ }
        load().finally(function () { if (!shown) Homey.ready({height: Math.ceil(document.getElementById('gs').scrollHeight) + 16}); });
        // A new day comes in each morning: an hourly refresh is plenty.
        setInterval(function () { if (!last || last.loading || last.empty) load(); }, 30000);
        setInterval(load, 60 * 60000);
      }
    </script>
  </body>
</html>
