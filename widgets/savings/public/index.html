<html>
  <head>
    <meta charset="utf-8">
    <style>
      /* The same card as the Autopilot widget (widgets/autopilot): title, a quiet chip, the status
         with its one number in colour on the right, a reason, a muted detail, then the chart. */
      .sv { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .sv-title { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sv-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
      .sv-chip { font-size: 0.8em; padding: 2px 8px; border-radius: 999px; background: transparent; border: 1px solid rgba(127, 127, 127, 0.4); opacity: 0.75; }
      .sv-status { margin: 12px 0 0; font-size: 1.35em; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
      .sv-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sv-value-box { display: flex; flex-direction: column; align-items: flex-end; }
      .sv-value-note { font-weight: 400; opacity: 0.75; white-space: nowrap; }
      .sv-value.bad { color: var(--sv-dear); }
      .sv-value.neutral { opacity: 0.75; }
      .sv-reason { margin: 4px 0 0; opacity: 0.85; font-variant-numeric: proportional-nums; }
      .sv-detail { margin: 2px 0 0; opacity: 0.65; font-variant-numeric: proportional-nums; }
      .sv-chart { display: block; margin-top: 14px; overflow: visible; }
      .sv-chart text { font-size: 11px; fill: currentColor; opacity: 0.75; }
      .sv-chart text.row-label { font-size: 12px; font-weight: 600; opacity: 1; }
      .sv-chart text.on-bar { fill: #ffffff; opacity: 1; font-weight: 600; }
      .sv-chart text.on-bar.mid { fill: currentColor; }
      .sv-value.good, .sv-tile-n.good { color: var(--sv-cheap); }
      .sv-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8em; opacity: 0.9; margin-top: 10px; }
      .sv-key { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
      .sv-foot { margin: 10px 0 0; font-size: 0.8em; opacity: 0.75; }
      .sv-sub { margin: 14px 0 0; font-size: 0.8em; opacity: 0.75; }
      .sv-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
      .sv-tile { border-radius: 12px; padding: 8px 10px; background: var(--sv-tile); }
      .sv-tile-k { font-size: 0.8em; opacity: 0.75; }
      .sv-tile-n { font-size: 1.35em; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
      .sv-tile-s { font-size: 0.8em; opacity: 0.75; }
      .sv-empty { opacity: 0.8; margin: 12px 0; }
      /* Starting: the plan being drawn. A soft curve draws itself, charge pills light up in turn and
         bars grow in, then it starts over. Everything rests, fully drawn, when motion is reduced. */
      .skel { fill: currentColor; fill-opacity: 0.06; }
      .ghost-line { fill: none; stroke: currentColor; stroke-opacity: 0.28; stroke-width: 2.2; stroke-linecap: round; }
      .ghost-fill { fill: currentColor; fill-opacity: 0.05; }
      .ghost-pill { fill: var(--ghost-accent, currentColor); fill-opacity: 0.55; }
      .ghost-bar { fill: currentColor; fill-opacity: 0.1; }
      .pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ghost-accent, currentColor); opacity: 0.6; margin-right: 8px; vertical-align: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        .ghost-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ghost-draw 4.2s cubic-bezier(.45, 0, .25, 1) infinite; }
        .ghost-fill { animation: ghost-fade 4.2s ease-in-out infinite; }
        .ghost-pill, .ghost-bar { transform-box: fill-box; transform-origin: left center; animation: ghost-grow 4.2s cubic-bezier(.3, 0, .2, 1) infinite both; }
        .ghost-bar.up { transform-origin: center bottom; animation-name: ghost-rise; }
        .pulse { animation: pulse 1.6s ease-in-out infinite; }
      }
      @keyframes ghost-draw { 0% { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } 55% { stroke-dashoffset: 0; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes ghost-fade { 0%, 20% { opacity: 0; } 60%, 85% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes ghost-grow { 0%, 45% { transform: scaleX(0); opacity: 0; } 60%, 85% { transform: scaleX(1); opacity: 1; } 100% { opacity: 0; } }
      @keyframes ghost-rise { 0%, 35% { transform: scaleY(0); opacity: 0; } 55%, 85% { transform: scaleY(1); opacity: 1; } 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.85; } }

      /* Cheap and dear meet 3:1 or better on their card; the middle third is a quiet grey on purpose.
         The theme is read from the text colour Homey gives the page (applyTheme), the media query first. */
      :root { --ghost-accent: #2d6bd6; --sv-cheap: #0f8374; --sv-middle: rgba(127, 127, 127, 0.4); --sv-dear: #c4580d; --sv-tile: rgba(127, 127, 127, 0.1); --sv-mid-dot: #8e8e93; --sv-ring: rgba(255, 255, 255, 0.9); }
      :root[data-theme="dark"] { --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-ring: rgba(0, 0, 0, 0.5); }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-ring: rgba(0, 0, 0, 0.5); }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="sv" id="sv"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      var TIER = ['var(--sv-cheap)', 'var(--sv-middle)', 'var(--sv-dear)'];
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }
      // Drawn at the card's real pixel width, so the text stays 11 px on any card.
      function chartWidth() {
        var sv = document.getElementById('sv'), cs = getComputedStyle(sv);
        return Math.max(240, Math.floor(sv.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
      }
      // Starting: the plan being drawn, so the card keeps its size and shows what is coming.
      // A typical day's price shape: low at night, a morning bump, the evening peak.
      function dayShape(t) { return 0.42 + 0.16 * Math.exp(-Math.pow((t - 0.33) / 0.07, 2)) + 0.38 * Math.exp(-Math.pow((t - 0.72) / 0.1, 2)) - 0.12 * Math.exp(-Math.pow((t - 0.12) / 0.12, 2)); }
      function ghostPath(x0, x1, y0, y1, f) {
        var d = '';
        for (var i = 0; i <= 60; i++) { var t = i / 60, x = x0 + (x1 - x0) * t, y = y1 - (y1 - y0) * f(t); d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
        return d;
      }
      // Hot water: the price curve draws itself, then the cheap hours light up as charges, one by one.
      function placeholder(height) {
        var W = chartWidth(), H = height, T = 22, B = H - 26, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        [T, (T + B) / 2, B].forEach(function (y) { svg.appendChild(svgEl('line', {x1: 0, x2: W, y1: y, y2: y, stroke: 'currentColor', 'stroke-opacity': 0.07})); });
        var line = ghostPath(0, W, T, B, dayShape);
        svg.appendChild(svgEl('path', {d: line + 'L' + W + ' ' + B + 'L0 ' + B + 'Z', class: 'ghost-fill'}));
        svg.appendChild(svgEl('path', {d: line, class: 'ghost-line', pathLength: 1}));
        // Charges at the cheap hours of that shape: the night, the midday dip.
        [[0.06, 0.12, 0], [0.44, 0.07, 0.3], [0.9, 0.08, 0.6]].forEach(function (p) {
          var pill = svgEl('rect', {x: W * p[0], y: B + 10, width: W * p[1], height: 8, rx: 4, class: 'ghost-pill'});
          pill.style.animationDelay = p[2] + 's';
          svg.appendChild(pill);
        });
        return svg;
      }
      // Savings: the before-and-with bars grow in, one after the other.
      function growing() {
        var W = chartWidth(), H = 96, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        // Before: an even split. With Autopilot: most of it in the cheap hours.
        [[8, 0, [0.34, 0.33, 0.33]], [54, 0.5, [0.55, 0.33, 0.12]]].forEach(function (r) {
          svg.appendChild(svgEl('rect', {x: 0, y: r[0], width: W * 0.28, height: 9, rx: 4.5, class: 'skel'}));
          var x = 0;
          [[r[2][0], 'var(--sv-cheap)'], [r[2][1], 'var(--sv-middle)'], [r[2][2], 'var(--sv-dear)']].forEach(function (p, i) {
            var bar = svgEl('rect', {x: x + (i ? 1 : 0), y: r[0] + 16, width: W * p[0] - (i ? 1 : 0), height: 22, rx: i === 0 || i === 2 ? 6 : 0, class: 'ghost-pill'});
            bar.style.animationDelay = (r[1] + i * 0.12) + 's'; bar.style.fill = p[1];
            svg.appendChild(bar); x += W * p[0];
          });
        });
        return svg;
      }
      // Heating: in the hours still to plan, the expected indoor line draws itself and shift bars rise.
      function planning(svg, x0, x1, top, bottom) {
        svg.appendChild(svgEl('path', {d: ghostPath(x0 + 6, x1, top + 10, bottom - 10, function (t) { return 0.55 + 0.12 * Math.sin(t * 5.5); }), class: 'ghost-line', pathLength: 1}));
        var n = Math.max(3, Math.floor((x1 - x0) / 22)), step = (x1 - x0) / n, mid = (top + bottom) / 2;
        for (var i = 0; i < n; i++) {
          var h = (bottom - top) * (0.12 + 0.22 * Math.abs(Math.sin(i * 1.7))), up = i % 3 !== 1;
          var bar = svgEl('rect', {x: x0 + i * step + step * 0.3, y: up ? mid - h : mid, width: step * 0.4, height: h, rx: 2, class: 'ghost-bar up'});
          bar.style.animationDelay = (i * 0.08) + 's';
          svg.appendChild(bar);
        }
      }

      // Heating: before and with Autopilot as two bars of 100 %, split by the share of kWh in the
      // cheapest, middle and most expensive third of each day's hours, with kWh a day beside them.
      function split(rows) {
        var W = chartWidth(), H = rows.length * 46 + 2, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        rows.forEach(function (r, k) {
          var y = k * 46 + 18, x = 0, id = 'sv-clip-' + k;
          // Rounded ends on the whole bar, whatever the card colour behind it.
          var defs = svgEl('defs', {}), clip = svgEl('clipPath', {id: id});
          clip.appendChild(svgEl('rect', {x: 0, y: y, width: W, height: 22, rx: 6}));
          defs.appendChild(clip); svg.appendChild(defs);
          var bar = svgEl('g', {'clip-path': 'url(#' + id + ')'});
          svg.appendChild(svgEl('text', {x: 0, y: y - 6, class: 'row-label'}, r.label));
          svg.appendChild(svgEl('text', {x: W, y: y - 6, 'text-anchor': 'end'}, r.perDay));
          r.shares.forEach(function (p, i) {
            var w = W * p;
            if (w <= 0) return;
            var gap = x > 0 ? 1 : 0;
            bar.appendChild(svgEl('rect', {x: x + gap, y: y, width: Math.max(0.5, w - gap), height: 22, fill: TIER[i]}));
            var label = Math.round(p * 100) + ' %';
            if (w > label.length * 6.5 + 8) bar.appendChild(svgEl('text', {x: x + w / 2, y: y + 15, 'text-anchor': 'middle', class: 'on-bar' + (i === 1 ? ' mid' : '')}, label));
            x += w;
          });
          svg.appendChild(bar);
        });
        return svg;
      }

      // Hot water: a column a day, each charge a dot at its place in that day's prices: the cheapest
      // third at the top, the most expensive at the bottom.
      function charges(c) {
        var W = chartWidth(), L = 70, R = W, T = 2, PH = 108, B = T + PH, H = B + 18;
        var n = c.days.length, step = (R - L) / Math.max(n, 7);
        var svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        var y = function (r) { return T + 8 + (PH - 16) * r; };
        c.bands.forEach(function (name, i) {
          var y0 = T + PH * i / 3, y1 = T + PH * (i + 1) / 3;
          svg.appendChild(svgEl('rect', {x: L, y: y0 + 1, width: R - L, height: y1 - y0 - 2, rx: 6, fill: TIER[i], 'fill-opacity': i === 1 ? 0.25 : 0.12}));
          svg.appendChild(svgEl('text', {x: L - 8, y: (y0 + y1) / 2 + 4, 'text-anchor': 'end'}, name));
        });
        c.days.forEach(function (d, k) {
          var cx = L + (k + 0.5) * step;
          d.ranks.forEach(function (r, j) {
            var off = d.ranks.length > 1 ? (j - (d.ranks.length - 1) / 2) * 9 : 0;
            svg.appendChild(svgEl('circle', {cx: cx + off, cy: y(r), r: 5.5, fill: r < 1 / 3 ? 'var(--sv-cheap)' : r < 2 / 3 ? 'var(--sv-mid-dot)' : 'var(--sv-dear)',
              stroke: 'var(--sv-ring)', 'stroke-width': 2}));
          });
          svg.appendChild(svgEl('text', {x: cx, y: H - 3, 'text-anchor': 'middle'}, d.label));
        });
        return svg;
      }

      function tiles(sh) {
        var box = el('div', 'sv-tiles');
        [sh.before, sh.now].forEach(function (t, i) {
          if (!t) return;
          var tile = el('div', 'sv-tile');
          tile.appendChild(el('div', 'sv-tile-k', t.label));
          tile.appendChild(el('div', 'sv-tile-n' + (i === 1 && sh.before ? ' good' : ''), t.value));
          if (t.note) tile.appendChild(el('div', 'sv-tile-s', t.note));
          box.appendChild(tile);
        });
        return box;
      }

      function legend(l) {
        var box = el('div', 'sv-legend');
        [{text: l.cheap, style: 'background: var(--sv-cheap);'}, {text: l.middle, style: 'background: var(--sv-middle);'},
          {text: l.dear, style: 'background: var(--sv-dear);'}].forEach(function (i) {
          if (!i.text) return;
          var item = el('span'), key = el('span', 'sv-key');
          key.style.cssText = i.style;
          item.appendChild(key); item.appendChild(document.createTextNode(i.text)); box.appendChild(item);
        });
        return box;
      }

      var last = null;
      function render(data) {
        applyTheme();
        var root = document.getElementById('sv');
        root.replaceChildren();
        if (data.title) root.appendChild(el('div', 'sv-title homey-text-small', data.title));
        if (data.empty) { root.appendChild(el('p', 'sv-empty', data.empty)); return; }
        if (data.badge) {
          var chips = el('div', 'sv-chips');
          chips.appendChild(el('span', 'sv-chip', data.badge));
          root.appendChild(chips);
        }
        if (data.status) {
          var status = el('p', 'sv-status');
          var name = el('span', '', data.status);
          if (data.loading) name.insertBefore(el('span', 'pulse'), name.firstChild);
          status.appendChild(name);
          if (data.value) {
            var box = el('span', 'sv-value-box');
            box.appendChild(el('span', 'sv-value ' + (data.tone || ''), data.value));
            if (data.valueNote) box.appendChild(el('span', 'sv-value-note homey-text-small', data.valueNote));
            status.appendChild(box);
          }
          root.appendChild(status);
        }
        if (data.reason) root.appendChild(el('p', 'sv-reason homey-text-small', data.reason));
        if (data.detail) root.appendChild(el('p', 'sv-detail homey-text-small', data.detail));
        if (data.loading) root.appendChild(growing());
        if (data.split) {
          root.appendChild(split(data.split));
          root.appendChild(legend(data.legend || {}));
        }
        if (data.shower) {
          root.appendChild(el('div', 'sv-sub', data.shower.title));
          root.appendChild(tiles(data.shower));
        }
        if (data.charges) {
          root.appendChild(el('div', 'sv-sub', data.charges.title));
          root.appendChild(charges(data.charges));
        }
        if (data.footnote) root.appendChild(el('p', 'sv-foot', data.footnote));
      }
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('sv').scrollHeight) + 16);
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        document.getElementById('sv').appendChild(el('p', 'sv-empty', words().loading));
        function show(data) { last = data; render(data); fit(Homey); }
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              document.getElementById('sv').replaceChildren(el('p', 'sv-empty', words().error));
              fit(Homey);
            });
        }
        load().finally(function () { Homey.ready(); });
        // A day is written once an hour at most: a quarter-hour refresh is plenty.
        setInterval(load, 15 * 60000);
        var timer = null;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { if (last) { render(last); fit(Homey); } }, 150);
        });
      }
    </script>
  </body>
</html>
