<html>
  <head>
    <meta charset="utf-8">
    <style>
      /* One hierarchy: a quiet caption, one large figure, a status pill, small figures as tiles, then
         each picture under a divider. Bars are 24 px, as thick as a line of text. */
      .sv { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .sv-label { margin: 4px 0 0; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sv-hero { margin: 14px 0 0; font-size: 3em; line-height: 1; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .sv-hero.good { color: var(--sv-cheap); }
      .sv-hero.bad { color: var(--sv-dear); }
      .sv-caption { margin: 4px 0 0; opacity: 0.6; }
      .sv-pill { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 8px 14px; border-radius: 14px; background: var(--sv-tile); font-size: 0.86em; line-height: 1.3; }
      .sv-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--sv-cheap); }
      .sv-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 0; }
      .sv-tile { background: var(--sv-tile); border-radius: 12px; padding: 10px 12px; min-width: 0; }
      .sv-tile-k { font-size: 0.8em; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sv-tile-k + .sv-tile-v { margin-top: 2px; }
      .sv-tile-v { font-size: 1.05em; font-weight: 600; font-variant-numeric: tabular-nums; }
      .sv-rule { height: 1px; background: var(--sv-rule); margin: 28px 0 16px; }
      .sv-sub { font-size: 0.72em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.55; }
      .sv-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 22px 0 0; }
      .sv-row-head:first-child { margin-top: 0; }
      .sv-row-k { font-weight: 600; font-size: 0.9em; }
      .sv-row-v { font-size: 0.8em; opacity: 0.6; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sv-bar { display: flex; gap: 2px; height: 28px; border-radius: 14px; overflow: hidden; margin: 10px 0 0; }
      .sv-part { display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--sv-on-tier); font-size: 0.82em; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .sv-part.mid { color: inherit; }
      .sv-part.lead { font-size: 0.95em; font-weight: 700; }
      .sv-part { min-width: 2px; }
      /* One label under each part of the bar: the cheap one from the left edge, the expensive one to
         the right edge, the middle one centred under its own part and kept clear of the other two. */
      .sv-marks { position: relative; margin: 8px 0 0; }
      .sv-mark { position: absolute; top: 0; white-space: nowrap; }
      .sv-mark.end { text-align: right; }
      .sv-mark-k { font-size: 0.78em; line-height: 1.3; }
      .sv-shower-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
      .sv-shower { display: flex; align-items: baseline; flex-wrap: wrap; flex: none; gap: 10px; white-space: nowrap; }
      .sv-was { font-size: 0.95em; opacity: 0.45; text-decoration: line-through; font-variant-numeric: tabular-nums; }
      .sv-now { font-size: 1.7em; font-weight: 600; font-variant-numeric: tabular-nums; }
      .sv-change { font-size: 0.86em; font-weight: 600; }
      .sv-days { display: grid; margin: 18px 0 0; text-align: center; font-size: 0.78em; }
      .sv-day-col { display: flex; justify-content: center; margin-bottom: 6px; }
      .sv-day-k { opacity: 0.45; }
      .sv-day-k.today { opacity: 1; font-weight: 700; }
      .sv-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78em; opacity: 0.7; margin-top: 18px; }
      .sv-key { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
      .sv-note { margin: 12px 0 0; opacity: 0.7; }
      .sv-empty { opacity: 0.8; margin: 12px 0; }
      .good { color: var(--sv-cheap); }
      .bad { color: var(--sv-dear); }
      /* Starting: the before-and-with bars grow in, then it starts over. They rest, fully drawn,
         when motion is reduced. */
      .sv-chart { display: block; margin-top: 16px; overflow: visible; }
      .skel { fill: currentColor; fill-opacity: 0.06; }
      .ghost-pill { fill-opacity: 0.55; }
      @media (prefers-reduced-motion: no-preference) {
        .ghost-pill { transform-box: fill-box; transform-origin: left center; animation: ghost-grow 4.2s cubic-bezier(.3, 0, .2, 1) infinite both; }
      }
      @keyframes ghost-grow { 0%, 45% { transform: scaleX(0); opacity: 0; } 60%, 85% { transform: scaleX(1); opacity: 1; } 100% { opacity: 0; } }

      /* Cheap and expensive meet 3:1 or better on their card; the middle third is a quiet grey on
         purpose. The theme is read from the text colour Homey gives the page (applyTheme), the media
         query first. */
      :root { --sv-on-tier: #ffffff; --sv-cheap: #0f8374; --sv-middle: rgba(127, 127, 127, 0.45); --sv-dear: #c4580d; --sv-tile: rgba(127, 127, 127, 0.1); --sv-rule: rgba(127, 127, 127, 0.25); }
      :root[data-theme="dark"] { --sv-on-tier: #10201e; --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-tile: rgba(255, 255, 255, 0.07); --sv-rule: rgba(255, 255, 255, 0.14); }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --sv-on-tier: #10201e; --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-tile: rgba(255, 255, 255, 0.07); --sv-rule: rgba(255, 255, 255, 0.14); }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="sv" id="sv"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }
      // Drawn at the card's real pixel width.
      function chartWidth() {
        var sv = document.getElementById('sv'), cs = getComputedStyle(sv);
        return Math.max(240, Math.floor(sv.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
      }
      // Starting: the before-and-with bars grow in, one after the other, as thick as the real ones.
      function growing() {
        var W = chartWidth(), H = 104, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        // Before: an even split. With Autopilot: most of it in the cheap hours.
        [[0, 0, [0.34, 0.33, 0.33]], [56, 0.5, [0.55, 0.33, 0.12]]].forEach(function (r) {
          svg.appendChild(svgEl('rect', {x: 0, y: r[0], width: W * 0.28, height: 10, rx: 5, class: 'skel'}));
          var x = 0;
          [[r[2][0], 'var(--sv-cheap)'], [r[2][1], 'var(--sv-middle)'], [r[2][2], 'var(--sv-dear)']].forEach(function (p, i) {
            var bar = svgEl('rect', {x: x + (i ? 1 : 0), y: r[0] + 20, width: W * p[0] - (i ? 1 : 0), height: 24, rx: i === 1 ? 0 : 12, class: 'ghost-pill'});
            bar.style.animationDelay = (r[1] + i * 0.12) + 's'; bar.style.fill = p[1];
            svg.appendChild(bar); x += W * p[0];
          });
        });
        return svg;
      }

      var TIER = ['var(--sv-cheap)', 'var(--sv-middle)', 'var(--sv-dear)'];
      function pct(p) { return Math.round(p * 100) + ' %'; }
      // A bar of 100 % split by the share in the cheapest, middle and most expensive third of each
      // day's hours, and a label under each part. `names` adds the third's name under its share.
      function tierBar(shares, names) {
        var total = shares[0] + shares[1] + shares[2], box = el('div');
        var p = shares.map(function (v) { return total > 0 ? v / total : 0; });
        // Each part carries its own share, the cheap one bold. A share that does not fit its part
        // is left out: the part's width says it.
        var bar = el('div', 'sv-bar'), inside = [];
        p.forEach(function (v, i) {
          if (v <= 0) return;
          var part = el('div', 'sv-part' + (i === 1 ? ' mid' : '') + (i === 0 ? ' lead' : ''));
          part.style.flex = String(v); part.style.background = TIER[i];
          var t = el('span', '', pct(v));
          part.appendChild(t); bar.appendChild(part); inside.push([part, t]);
        });
        box.appendChild(bar);
        layouts.push(function () {
          inside.forEach(function (x) { if (x[1].offsetWidth + 12 > x[0].clientWidth) x[1].style.display = 'none'; });
        });
        if (!names) return box;
        // The thirds' names under their parts: the cheap one from the left edge, the expensive one
        // to the right edge, the middle one centred under its part, kept clear of the other two.
        var marks = el('div', 'sv-marks'), items = [];
        p.forEach(function (v, i) {
          var m = el('div', 'sv-mark sv-mark-k' + (i === 2 ? ' end' : ''), names[i] || '');
          m.style.color = i === 1 ? 'inherit' : TIER[i];
          if (i === 1) m.style.opacity = 0.6;
          marks.appendChild(m); items.push(m);
        });
        box.appendChild(marks);
        layouts.push(function () {
          var W = marks.clientWidth, w = items.map(function (m) { return m.offsetWidth; }), GAP = 16;
          items[0].style.left = '0';
          items[2].style.right = '0';
          var lo = w[0] + GAP, hi = W - w[2] - GAP, centre = W * (p[0] + p[1] / 2);
          if (p[1] > 0 && hi - lo >= w[1]) items[1].style.left = Math.min(hi - w[1], Math.max(lo, centre - w[1] / 2)) + 'px';
          else items[1].style.display = 'none';
          marks.style.height = Math.max.apply(null, items.map(function (m) { return m.offsetHeight; })) + 'px';
        });
        return box;
      }

      function legend(l) {
        var box = el('div', 'sv-legend');
        [{text: l.cheap, colour: TIER[0]}, {text: l.middle, colour: TIER[1]}, {text: l.dear, colour: TIER[2]}].forEach(function (i) {
          if (!i.text) return;
          var item = el('span'), key = el('span', 'sv-key');
          key.style.background = i.colour;
          item.appendChild(key); item.appendChild(document.createTextNode(i.text)); box.appendChild(item);
        });
        return box;
      }

      // A money figure as a number, for the shower's change: '4,03 kr' → 4.03.
      function amount(s) {
        var m = String(s || '').replace(/\s/g, '').replace('−', '-').match(/-?\d+(?:[.,]\d+)?/);
        return m ? parseFloat(m[0].replace(',', '.')) : NaN;
      }

      var layouts = [];
      var last = null;
      function render(data) {
        applyTheme();
        layouts = [];
        var root = document.getElementById('sv');
        root.replaceChildren();
        // The card's own title names it; the device name is not repeated.
        if (data.empty) { root.appendChild(el('p', 'sv-note', data.empty)); return; }
        if (data.status) root.appendChild(el('div', 'sv-label', data.status));
        if (data.value) {
          root.appendChild(el('div', 'sv-hero ' + (data.tone || ''), data.value));
          if (data.valueNote) root.appendChild(el('div', 'sv-caption homey-text-small', data.valueNote));
        }
        if (data.reason) {
          var pill = el('div', 'sv-pill');
          pill.appendChild(el('span', 'sv-dot'));
          pill.appendChild(el('span', '', data.reason));
          root.appendChild(pill);
        }
        if (data.stats && data.stats.length) {
          var tiles = el('div', 'sv-tiles');
          data.stats.forEach(function (s) {
            var t = el('div', 'sv-tile');
            t.appendChild(el('div', 'sv-tile-k', s.label));
            t.appendChild(el('div', 'sv-tile-v', s.value));
            tiles.appendChild(t);
          });
          root.appendChild(tiles);
        }
        if (data.loading) root.appendChild(growing());
        var l = data.legend || {};
        if (data.split) {
          root.appendChild(el('div', 'sv-rule'));
          var rows = el('div');
          data.split.forEach(function (r) {
            var head = el('div', 'sv-row-head');
            head.appendChild(el('span', 'sv-row-k', r.label));
            head.appendChild(el('span', 'sv-row-v', r.perDay));
            rows.appendChild(head);
            rows.appendChild(tierBar(r.shares));
          });
          root.appendChild(rows);
          root.appendChild(legend(l));
        }
        if (data.shower) {
          // One row: what it is on the left, the figures on the right.
          root.appendChild(el('div', 'sv-rule'));
          var row = el('div', 'sv-shower-row'), what = el('div'), b = data.shower.before, n = data.shower.now;
          what.appendChild(el('div', 'sv-sub', data.shower.title));
          var cap = [b && b.label, n && n.label].filter(Boolean).join(' → ') + (n && n.note ? ' · ' + n.note : '');
          if (cap) what.appendChild(el('div', 'sv-caption homey-text-small', cap));
          row.appendChild(what);
          var line = el('div', 'sv-shower');
          if (b) line.appendChild(el('span', 'sv-was', b.value));
          if (n) line.appendChild(el('span', 'sv-now', n.value));
          var was = amount(b && b.value), now = amount(n && n.value);
          if (b && n && was > 0 && isFinite(now)) {
            var change = Math.round((now / was - 1) * 100);
            line.appendChild(el('span', 'sv-change ' + (change < 0 ? 'good' : change > 0 ? 'bad' : ''), (change > 0 ? '+' : change < 0 ? '−' : '±') + Math.abs(change) + ' %'));
          }
          row.appendChild(line);
          root.appendChild(row);
        }
        if (data.share) {
          var c = data.share;
          root.appendChild(el('div', 'sv-rule'));
          root.appendChild(el('div', 'sv-sub', c.title));
          if (c.value) root.appendChild(el('div', 'sv-caption homey-text-small', c.value + (c.note ? ' · ' + c.note : '')));
          root.appendChild(tierBar(c.tiers, [l.cheap, l.middle, l.dear]));
          // A ring a day, filled to that day's share in the cheapest third. An empty ring: no
          // record, or no heat; fainter when there is no record at all.
          if (c.days && c.days.length) {
            var days = el('div', 'sv-days'), R = 10, SW = 4, S = 2 * R + SW, m = S / 2;
            days.style.gridTemplateColumns = 'repeat(' + c.days.length + ', 1fr)';
            c.days.forEach(function (d, k) {
              var col = el('div'), well = el('div', 'sv-day-col');
              var ring = svgEl('svg', {viewBox: '0 0 ' + S + ' ' + S, width: S, height: S, role: 'img'});
              ring.appendChild(svgEl('circle', {cx: m, cy: m, r: R, fill: 'none', stroke: 'currentColor', 'stroke-opacity': d.share === undefined ? 0.08 : 0.15, 'stroke-width': SW}));
              if (d.share !== undefined && d.share > 0) {
                if (d.share >= 0.999) ring.appendChild(svgEl('circle', {cx: m, cy: m, r: R, fill: 'none', stroke: 'var(--sv-cheap)', 'stroke-width': SW}));
                else {
                  var t = d.share * 2 * Math.PI;
                  ring.appendChild(svgEl('path', {d: 'M' + m + ' ' + (m - R) + ' A' + R + ' ' + R + ' 0 ' + (t > Math.PI ? 1 : 0) + ' 1 ' + (m + R * Math.sin(t)) + ' ' + (m - R * Math.cos(t)),
                    fill: 'none', stroke: 'var(--sv-cheap)', 'stroke-width': SW, 'stroke-linecap': 'round'}));
                }
              }
              well.appendChild(ring); col.appendChild(well);
              var label = el('div', 'sv-day-k' + (k === c.days.length - 1 ? ' today' : ''), d.label);
              if (d.share === undefined) label.style.opacity = 0.3;
              col.appendChild(label);
              days.appendChild(col);
            });
            root.appendChild(days);
          }
        }
        layouts.forEach(function (f) { f(); });
      }
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('sv').scrollHeight) + 16);
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        document.getElementById('sv').appendChild(el('p', 'sv-empty', words().loading));
        function show(data) { failures = 0; last = data; render(data); fit(Homey); }
        var failures = 0;
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              // An install or a restart leaves the app unreachable for a minute or two: keep saying
              // "Loading…" and try every 30 s, and call it an error only after two minutes of that.
              if (++failures < 5) { setTimeout(load, 30000); return; }
              document.getElementById('sv').replaceChildren(el('p', 'sv-empty', words().error));
              fit(Homey);
            });
        }
        load().finally(function () { Homey.ready(); });
        // A day is written once an hour at most: a quarter-hour refresh is plenty. While the card is
        // starting, or answered with a line, it asks again every 30 s until it has its picture.
        setInterval(function () { if (!last || last.loading || last.empty) load(); }, 30000);
        setInterval(load, 15 * 60000);
        var timer = null;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { if (last) { render(last); fit(Homey); } }, 150);
        });
      }
    </script>
  </body>
</html>
