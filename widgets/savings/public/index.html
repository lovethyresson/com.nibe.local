<html>
  <head>
    <meta charset="utf-8">
    <style>
      /* Three levels and no more: the month's figure; each section's one number; quiet labels.
         Spacing on a 4 / 8 / 16 / 24 px scale: tight inside a section, wide between sections.
         Nothing the owner needs to read sits under 60 % opacity. */
      .sv { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .sv-label { opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sv-hero { margin: 8px 0 0; font-size: 2.5em; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .sv-hero.good { color: var(--sv-cheap); }
      .sv-hero.bad { color: var(--sv-dear); }
      .sv-caption { margin: 4px 0 0; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      /* A state, not a result: a neutral dot, so "not yet" never reads as "all good". */
      .sv-pill { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 8px 12px; border-radius: 12px; background: var(--sv-tile); font-size: 0.86em; line-height: 1.35; }
      .sv-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.45; }
      .sv-stats { display: flex; gap: 24px; margin: 16px 0 0; }
      .sv-stat-k { font-size: 0.8em; opacity: 0.6; }
      .sv-stat-v { font-size: 1.15em; font-weight: 600; font-variant-numeric: tabular-nums; }
      .sv-rule { height: 1px; background: var(--sv-rule); margin: 24px 0 16px; }
      .sv-sub { font-size: 0.75em; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
      .sv-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .sv-row + .sv-row { margin-top: 16px; }
      .sv-row-k { font-size: 0.9em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sv-row-v { font-size: 0.8em; opacity: 0.6; font-variant-numeric: tabular-nums; white-space: nowrap; }
      /* The bar: 100 % of the heat, split by the cheapest, middle and most expensive third of each
         day's hours. 28 px, fully rounded, 2 px seams. */
      .sv-bar { display: flex; gap: 2px; height: 28px; border-radius: 14px; overflow: hidden; margin: 8px 0 0; }
      .sv-part { min-width: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap;
        color: var(--sv-on-tier); font-size: 0.82em; font-weight: 600; font-variant-numeric: tabular-nums; }
      .sv-part.mid { color: inherit; }
      .sv-part.lead { font-size: 0.95em; font-weight: 700; }
      /* Labels under the bar, each under its own part: the cheap one from the left edge, the
         expensive one to the right edge, the middle one centred and kept clear of the other two. */
      .sv-marks { position: relative; margin: 8px 0 0; }
      .sv-mark { position: absolute; top: 0; white-space: nowrap; }
      .sv-mark.end { text-align: right; }
      .sv-mark-v { font-size: 0.95em; font-weight: 400; opacity: 0.6; font-variant-numeric: tabular-nums; line-height: 1.3; }
      .sv-mark-v.lead { font-weight: 600; opacity: 1; color: var(--sv-cheap); }
      .sv-mark-k { font-size: 0.78em; line-height: 1.35; }
      .sv-mark-k.cheap { color: var(--sv-cheap); }
      .sv-mark-k.dear { color: var(--sv-dear); }
      .sv-mark-k.mid { opacity: 0.6; }
      .sv-shower { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 0; white-space: nowrap; }
      .sv-now { font-size: 1.6em; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
      .sv-was { font-size: 1em; opacity: 0.6; text-decoration: line-through; font-variant-numeric: tabular-nums; }
      .sv-change { font-size: 0.86em; font-weight: 600; }
      .sv-note { margin: 16px 0 0; opacity: 0.7; }
      .sv-empty { opacity: 0.8; margin: 16px 0; }
      .sv-year { margin: 16px 0 0; }
      .sv-ybar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--sv-tile); }
      .sv-ybar .got { background: var(--sv-cheap); }
      .sv-ybar .est { background: repeating-linear-gradient(135deg, var(--sv-cheap) 0 3px, transparent 3px 7px); opacity: .55; }
      .sv-ylab { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 0; font-size: 0.82em; font-variant-numeric: tabular-nums; }
      .sv-ylab span { display: flex; flex-direction: column; }
      .sv-ylab span:last-child { text-align: right; }
      .sv-ylab b { font-size: 1.1em; font-weight: 600; }
      .sv-ylab i { opacity: 0.6; font-style: normal; }
      .good { color: var(--sv-cheap); }
      .bad { color: var(--sv-dear); }
      /* Starting: bars the size of the real ones grow in, then it starts over. They rest, fully
         drawn, when motion is reduced. */
      .sv-chart { display: block; margin-top: 24px; overflow: visible; }
      .skel { fill: currentColor; fill-opacity: 0.08; }
      .ghost-pill { fill-opacity: 0.55; }
      @media (prefers-reduced-motion: no-preference) {
        .ghost-pill { transform-box: fill-box; transform-origin: left center; animation: ghost-grow 4.2s cubic-bezier(.3, 0, .2, 1) infinite both; }
      }
      @keyframes ghost-grow { 0%, 45% { transform: scaleX(0); opacity: 0; } 60%, 85% { transform: scaleX(1); opacity: 1; } 100% { opacity: 0; } }

      /* Measured on the card (#fff, #1c1c1e): cheap 4.7:1 and expensive 5.1:1 as text in light,
         6.6:1 and 6.3:1 in dark; the share on each part 4.7:1 or better. The middle third is a
         solid quiet grey. The theme is read from the text colour Homey gives the page (applyTheme),
         the media query first. */
      :root { --sv-cheap: #0f8374; --sv-dear: #b4500c; --sv-middle: #c7c7cc; --sv-on-tier: #ffffff;
        --sv-tile: rgba(127, 127, 127, 0.12); --sv-rule: rgba(127, 127, 127, 0.25); }
      :root[data-theme="dark"] { --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-middle: #545458; --sv-on-tier: #10201e;
        --sv-tile: rgba(255, 255, 255, 0.07); --sv-rule: rgba(255, 255, 255, 0.14); }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --sv-cheap: #2bb3a3; --sv-dear: #e8833a; --sv-middle: #545458; --sv-on-tier: #10201e;
          --sv-tile: rgba(255, 255, 255, 0.07); --sv-rule: rgba(255, 255, 255, 0.14); }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="sv" id="sv"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }
      // Drawn at the card's real pixel width.
      function chartWidth() {
        var sv = document.getElementById('sv'), cs = getComputedStyle(sv);
        return Math.max(240, Math.floor(sv.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
      }
      // Starting: the before-and-with bars grow in, one after the other, the size of the real ones.
      function growing() {
        var W = chartWidth(), H = 116, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'sv-chart', role: 'img'});
        // Before: an even split. With Autopilot: most of it in the cheap hours.
        [[0, 0, [0.34, 0.33, 0.33]], [62, 0.5, [0.55, 0.33, 0.12]]].forEach(function (r) {
          svg.appendChild(svgEl('rect', {x: 0, y: r[0], width: W * 0.28, height: 10, rx: 5, class: 'skel'}));
          var x = 0;
          [[r[2][0], 'var(--sv-cheap)'], [r[2][1], 'var(--sv-middle)'], [r[2][2], 'var(--sv-dear)']].forEach(function (p, i) {
            var bar = svgEl('rect', {x: x + (i ? 1 : 0), y: r[0] + 22, width: W * p[0] - (i ? 1 : 0), height: 28, rx: i === 1 ? 0 : 14, class: 'ghost-pill'});
            bar.style.animationDelay = (r[1] + i * 0.12) + 's'; bar.style.fill = p[1];
            svg.appendChild(bar); x += W * p[0];
          });
        });
        return svg;
      }

      var TIER = ['var(--sv-cheap)', 'var(--sv-middle)', 'var(--sv-dear)'];
      var NAME = ['cheap', 'mid', 'dear'];
      function pct(p) { return Math.round(p * 100) + ' %'; }
      // A bar of 100 % split by the share in the cheapest, middle and most expensive third of each
      // day's hours. `inside`: each share on its own part (a share that does not fit is left out, the
      // part's width says it); otherwise each share under its part. `names`: the thirds' names under.
      function tierBar(shares, inside, names) {
        var total = shares[0] + shares[1] + shares[2], box = el('div');
        var p = shares.map(function (v) { return total > 0 ? v / total : 0; });
        var bar = el('div', 'sv-bar'), onBar = [];
        p.forEach(function (v, i) {
          if (v <= 0) return;
          var part = el('div', 'sv-part' + (i === 1 ? ' mid' : '') + (i === 0 ? ' lead' : ''));
          part.style.flex = String(v); part.style.background = TIER[i];
          if (inside) { var t = el('span', '', pct(v)); part.appendChild(t); onBar.push([part, t]); }
          bar.appendChild(part);
        });
        box.appendChild(bar);
        if (onBar.length) layouts.push(function () {
          onBar.forEach(function (x) { if (x[1].offsetWidth + 12 > x[0].clientWidth) x[1].style.display = 'none'; });
        });
        if (inside && !names) return box;
        var marks = el('div', 'sv-marks'), items = [];
        p.forEach(function (v, i) {
          var m = el('div', 'sv-mark' + (i === 2 ? ' end' : ''));
          if (!inside) m.appendChild(el('div', 'sv-mark-v' + (i === 0 ? ' lead' : ''), pct(v)));
          if (names && names[i]) m.appendChild(el('div', 'sv-mark-k ' + NAME[i], names[i]));
          marks.appendChild(m); items.push(m);
        });
        box.appendChild(marks);
        // Placed once the labels have a width; the middle one is left out when there is no room
        // between the other two, or no middle part.
        layouts.push(function () {
          var W = marks.clientWidth, w = items.map(function (m) { return m.offsetWidth; }), GAP = 16;
          items[0].style.left = '0';
          items[2].style.right = '0';
          var lo = w[0] + GAP, hi = W - w[2] - GAP, centre = W * (p[0] + p[1] / 2);
          if (p[1] > 0 && hi - lo >= w[1]) items[1].style.left = Math.min(hi - w[1], Math.max(lo, centre - w[1] / 2)) + 'px';
          else items[1].style.display = 'none';
          marks.style.height = Math.max.apply(null, items.map(function (m) { return m.offsetHeight; })) + 'px';
        });
        return box;
      }

      // A money figure as a number, for the shower's change: '4,03 kr' → 4.03.
      function amount(s) {
        var m = String(s || '').replace(/\s/g, '').replace('−', '-').match(/-?\d+(?:[.,]\d+)?/);
        return m ? parseFloat(m[0].replace(',', '.')) : NaN;
      }

      var layouts = [];
      var last = null;
      function render(data) {
        applyTheme();
        layouts = [];
        var root = document.getElementById('sv');
        root.replaceChildren();
        // The card's own title names it; the device name is not repeated.
        if (data.empty) { root.appendChild(el('p', 'sv-note', data.empty)); return; }
        if (data.status) root.appendChild(el('div', 'sv-label', data.status));
        if (data.value) {
          root.appendChild(el('div', 'sv-hero ' + (data.tone || ''), data.value));
          if (data.valueNote) root.appendChild(el('div', 'sv-caption homey-text-small', data.valueNote));
        }

        // The calendar year: saved so far, solid; the rest at the pace so far, hatched.
        if (data.year) {
          var y = data.year, yb = el('div', 'sv-year'), bar = el('div', 'sv-ybar');
          var got = el('span', 'got'); got.style.width = (y.share * 100) + '%';
          var est = el('span', 'est'); est.style.width = ((1 - y.share) * 100) + '%';
          bar.append(got, est); yb.appendChild(bar);
          var lab = el('div', 'sv-ylab'), so = el('span'), rest = el('span');
          so.append(el('i', '', y.savedLabel), el('b', 'good', y.saved));
          rest.append(el('i', '', y.restLabel), el('b', '', y.rest));
          lab.append(so, rest); yb.appendChild(lab); root.appendChild(yb);
        }
        if (data.reason) {
          var pill = el('div', 'sv-pill');
          pill.appendChild(el('span', 'sv-dot'));
          pill.appendChild(el('span', '', data.reason));
          root.appendChild(pill);
        }
        if (data.stats && data.stats.length) {
          var stats = el('div', 'sv-stats');
          data.stats.forEach(function (s) {
            var box = el('div');
            box.appendChild(el('div', 'sv-stat-k', s.label));
            box.appendChild(el('div', 'sv-stat-v', s.value));
            stats.appendChild(box);
          });
          root.appendChild(stats);
        }
        if (data.loading) root.appendChild(growing());
        var l = data.legend || {}, names = [l.cheap, l.middle, l.dear];
        // Heating: before over with, each share under its part; the thirds' names under the last bar.
        if (data.split) {
          root.appendChild(el('div', 'sv-rule'));
          data.split.forEach(function (r, k) {
            var row = el('div', 'sv-row'), head = el('div', 'sv-row-head');
            head.appendChild(el('span', 'sv-row-k', r.label));
            head.appendChild(el('span', 'sv-row-v', r.perDay));
            row.appendChild(head);
            row.appendChild(tierBar(r.shares, false, k === data.split.length - 1 ? names : null));
            root.appendChild(row);
          });
        }
        // Hot water: one shower before and with Autopilot, the figure first, what it compares under.
        if (data.shower) {
          var b = data.shower.before, n = data.shower.now;
          root.appendChild(el('div', 'sv-rule'));
          root.appendChild(el('div', 'sv-sub', data.shower.title));
          var line = el('div', 'sv-shower');
          if (n) line.appendChild(el('span', 'sv-now', n.value));
          if (b) line.appendChild(el('span', 'sv-was', b.value));
          var was = amount(b && b.value), now = amount(n && n.value);
          if (b && n && was > 0 && isFinite(now)) {
            var change = Math.round((now / was - 1) * 100);
            line.appendChild(el('span', 'sv-change ' + (change < 0 ? 'good' : change > 0 ? 'bad' : ''), (change > 0 ? '+' : change < 0 ? '−' : '±') + Math.abs(change) + ' %'));
          }
          root.appendChild(line);
          // The struck figure says "before" on its own; the caption names the period.
          var cap = [n && n.label, n && n.note].filter(Boolean).join(' · ');
          if (cap) root.appendChild(el('div', 'sv-caption homey-text-small', cap));
        }
        layouts.forEach(function (f) { f(); });
      }

      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('sv').scrollHeight) + 16);
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        // Widgets share one storage: the key names this one (its path) and the device it shows.
        var cacheKey = 'last:' + location.pathname + ':' + (device || ''), KEEP_MS = 3 * 3600000;
        function keep(data) {
          if (!data || data.loading || data.empty) return;
          try { localStorage.setItem(cacheKey, JSON.stringify({at: Date.now(), data: data})); } catch (e) { /* no storage */ }
        }
        document.getElementById('sv').appendChild(el('p', 'sv-empty', words().loading));
        function show(data) {
          // Starting (just after a restart): ask again in 5 s, not at the next refresh, and keep
          // the picture already shown meanwhile.
          if (data && data.loading && !soon) soon = setTimeout(function () { soon = null; load(); }, 5000);
          if (data && data.loading && last && !last.loading) return;
          failures = 0; last = data; render(data); fit(Homey); keep(data);
        }
        var soon = null;
        var failures = 0;
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              // An install or a restart leaves the app unreachable for a minute or two: keep saying
              // "Loading…" and try every 30 s, and call it an error only after two minutes of that.
              if (++failures < 5) { setTimeout(load, 30000); return; }
              document.getElementById('sv').replaceChildren(el('p', 'sv-empty', words().error));
              fit(Homey);
            });
        }
        // ready() without a height puts the widget back to its compose height: the fit done while
        // loading would be lost, and a long card clipped (Plan vs actual, 2026-11-21).
        // The last picture this card showed, drawn at once while the app is asked: the dashboard
        // opens without waiting on the app, and the answer replaces it a moment later.
        var shown = false;
        try {
          var kept = JSON.parse(localStorage.getItem(cacheKey) || 'null');
          if (kept && Date.now() - kept.at < KEEP_MS) { last = kept.data; render(kept.data); Homey.ready({height: Math.ceil(document.getElementById('sv').scrollHeight) + 16}); shown = true; }
        } catch (e) { /* no storage: wait for the app, as before */ }
        load().finally(function () { if (!shown) Homey.ready({height: Math.ceil(document.getElementById('sv').scrollHeight) + 16}); });
        // A day is written once an hour at most: a quarter-hour refresh is plenty. While the card is
        // starting, or answered with a line, it asks again every 30 s until it has its picture.
        setInterval(function () { if (!last || last.loading || last.empty) load(); }, 30000);
        setInterval(load, 15 * 60000);
        var timer = null;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { if (last) { render(last); fit(Homey); } }, 150);
        });
      }
    </script>
  </body>
</html>
