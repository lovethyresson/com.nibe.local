<html>
  <head>
    <style>
      /* Three levels (lib/autopilot/overview.ts): a band for what needs the owner and the activity
         line, two tiles, then quiet facts. Figures in two sizes only; colour only for a function,
         a warning and a saving. */
      :root { --ov-heat: #2d6bd6; --ov-water: #7652d6; --ov-pool: #0f8374; --ov-cool: #3b8fd9; --ov-idle: #8e8e93;
        --ov-save: #0f8374; --ov-warn: #b25f00; --ov-warnbg: #fdf1e4; --ov-bad: #c62828; --ov-badbg: #fdecec;
        --ov-tile: rgba(127, 127, 127, 0.09); --ov-line: rgba(127, 127, 127, 0.2); --ov-sub: rgba(127, 127, 127, 1); }
      :root[data-theme="dark"] { --ov-heat: #4da3ff; --ov-water: #a48cff; --ov-pool: #2bb3a3; --ov-cool: #6cb4f5;
        --ov-save: #2bb3a3; --ov-warn: #f0b04a; --ov-warnbg: rgba(240, 176, 74, 0.16); --ov-bad: #ff6b6b; --ov-badbg: rgba(255, 107, 107, 0.16);
        --ov-tile: rgba(127, 127, 127, 0.18); }
      .ov { padding: 12px 16px 14px; }
      .ov-empty { opacity: 0.8; margin: 12px 0; }
      .ov-alert { display: flex; gap: 12px; align-items: center; margin: -12px -16px 12px; padding: 12px 16px; background: var(--abg); }
      .ov-alert .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ac); color: #fff; display: grid; place-items: center; font-weight: 800; }
      .ov-alert .tx { flex: 1; font-size: 13px; line-height: 1.3; color: var(--ov-sub); }
      .ov-alert .tx b { display: block; font-size: 17px; line-height: 1.25; color: var(--ac); margin-bottom: 2px; }
      .ov-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
      .ov-title { font-size: 13px; font-weight: 600; color: var(--ov-sub); }
      .ov-chip { font-size: 12px; font-weight: 600; color: var(--ov-sub); padding: 2px 9px; border-radius: 10px; background: var(--ov-tile); }
      .ov-ic { flex: none; display: grid; place-items: center; color: var(--c); }
      .ov-ic svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .ov-now { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .ov-now .ov-ic { width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); }
      .ov-now .ov-ic svg { width: 26px; height: 26px; }
      .ov-now b { display: block; font-size: 26px; line-height: 1.1; font-weight: 700; color: var(--c); }
      .ov-now span.sub { display: block; font-size: 13px; color: var(--ov-sub); margin-top: 3px; }
      .ov-now.quiet .ov-ic { width: 36px; height: 36px; border-radius: 11px; }
      .ov-now.quiet .ov-ic svg { width: 20px; height: 20px; }
      .ov-now.quiet b { font-size: 17px; }
      .ov-tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
      .ov-tile { position: relative; background: var(--ov-tile); border-radius: 14px; padding: 10px 12px; min-width: 0; }
      .ov-tile .lab { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ov-sub); }
      .ov-tile .lab svg { width: 14px; height: 14px; }
      .ov-tile .fig { font-size: 22px; font-weight: 700; margin: 4px 0 1px; white-space: nowrap; }
      .ov-tile .sm { font-size: 13px; line-height: 1.3; color: var(--ov-sub); }
      .ov-facts { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--ov-line); display: grid; grid-template-columns: auto minmax(0, 1fr);
        column-gap: 14px; row-gap: 9px; font-size: 13px; color: var(--ov-sub); }
      .ov-facts .split { margin-top: 10px; }
      .ov-facts dt { opacity: 0.85; }
      .ov-facts dd { margin: 0; text-align: right; }
      .ov-facts .save { color: var(--ov-save); }
      .ov.stale .ov-tiles, .ov.stale .ov-facts { opacity: 0.5; }
      .skel { border-radius: 14px; background: var(--ov-tile); }
    </style>
    </head>

  <body class="homey-widget">
    <div class="ov" id="ov"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }

      var ICON = {
        heating: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M12 17a2 2 0 0 0 2-2c0-1.5-2-3.5-2-3.5s-2 2-2 3.5a2 2 0 0 0 2 2z"/>',
        hotwater: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
        pool: '<path d="M2 15c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M2 19.5c2 0 2-1.5 4-1.5s2 1.5 4 1.5 2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M8 11V5a2 2 0 0 1 4 0M16 11V5"/>',
        cooling: '<path d="M12 2v20M4.5 6.5l15 11M19.5 6.5l-15 11"/><path d="M9 4l3 2 3-2M9 20l3-2 3 2"/>'
      };
      var COLOUR = {heating: 'var(--ov-heat)', hotwater: 'var(--ov-water)', pool: 'var(--ov-pool)', cooling: 'var(--ov-cool)', idle: 'var(--ov-idle)'};
      ICON.idle = '<circle cx="12" cy="12" r="9"/><path d="M9 12h6"/>';

      function icon(kind, cls) {
        var ic = el('span', 'ov-ic' + (cls ? ' ' + cls : ''));
        ic.style.setProperty('--c', COLOUR[kind]);
        ic.appendChild(svgEl('svg', {viewBox: '0 0 24 24'}));
        ic.firstChild.innerHTML = ICON[kind];
        return ic;
      }

      function render(data) {
        applyTheme();
        var root = document.getElementById('ov');
        root.replaceChildren();
        root.className = 'ov' + (data.stale ? ' stale' : '');
        if (data.empty) { root.appendChild(el('p', 'ov-empty', data.empty)); return; }
        // Level 1: the band, then what the pump does now.
        if (data.alert) {
          var band = el('div', 'ov-alert');
          band.style.setProperty('--ac', data.alert.tone === 'bad' ? 'var(--ov-bad)' : 'var(--ov-warn)');
          band.style.setProperty('--abg', data.alert.tone === 'bad' ? 'var(--ov-badbg)' : 'var(--ov-warnbg)');
          band.appendChild(el('span', 'dot', '!'));
          var tx = el('div', 'tx');
          tx.appendChild(el('b', '', data.alert.title));
          if (data.alert.text) tx.appendChild(document.createTextNode(data.alert.text));
          band.appendChild(tx);
          root.appendChild(band);
        }
        var head = el('div', 'ov-head');
        head.appendChild(el('span', 'ov-title', data.title));
        if (data.chip) head.appendChild(el('span', 'ov-chip', data.chip));
        root.appendChild(head);
        if (data.loading) {
          var sk = el('div', 'skel'); sk.style.height = '160px'; root.appendChild(sk);
          return;
        }
        if (data.now) {
          var now = el('div', 'ov-now' + (data.now.quiet ? ' quiet' : ''));
          now.style.setProperty('--c', COLOUR[data.now.kind]);
          now.appendChild(icon(data.now.kind));
          var words = el('div');
          words.appendChild(el('b', '', data.now.title));
          if (data.now.sub) words.appendChild(el('span', 'sub', data.now.sub));
          now.appendChild(words);
          root.appendChild(now);
        }
        // Level 2: a tile per function, two to a row.
        var tiles = el('div', 'ov-tiles');
        (data.tiles || []).forEach(function (t) {
          var tile = el('div', 'ov-tile');
          var lab = el('div', 'lab');
          lab.appendChild(icon(t.kind));
          lab.appendChild(document.createTextNode(t.label));
          tile.appendChild(lab);
          tile.appendChild(el('div', 'fig', t.value || '—'));
          tile.appendChild(el('div', 'sm', t.sub || '\u00a0'));
          tiles.appendChild(tile);
        });
        root.appendChild(tiles);
        // Level 3: quiet facts.
        if ((data.facts || []).length) {
          var dl = el('dl', 'ov-facts');
          data.facts.forEach(function (f) {
            dl.appendChild(el('dt', f.split ? 'split' : '', f.label));
            var dd = el('dd', f.split ? 'split' : '');
            dd.appendChild(el('span', f.good ? 'save' : '', f.value));
            dl.appendChild(dd);
          });
          root.appendChild(dl);
        }
      }

      var last = null;
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('ov').scrollHeight) + 16);
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        // Widgets share one storage: the key names this one (its path) and the device it shows.
        var cacheKey = 'last:' + location.pathname + ':' + (device || ''), KEEP_MS = 3 * 3600000;
        function keep(data) {
          if (!data || data.loading || data.empty) return;
          try { localStorage.setItem(cacheKey, JSON.stringify({at: Date.now(), data: data})); } catch (e) { /* no storage */ }
        }
        document.getElementById('ov').appendChild(el('p', 'ov-empty', words().loading));
        function show(data) {
          // Starting (just after a restart): ask again in 5 s, not at the next refresh, and keep
          // the picture already shown meanwhile.
          if (data && data.loading && !soon) soon = setTimeout(function () { soon = null; load(); }, 5000);
          if (data && data.loading && last && !last.loading) return;
          failures = 0; last = data; render(data); fit(Homey); keep(data);
        }
        var soon = null;
        var failures = 0;
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              // An install or a restart leaves the app unreachable for a minute or two: keep saying
              // "Loading…" and try every 30 s, and call it an error only after two minutes of that.
              if (++failures < 5) { setTimeout(load, 30000); return; }
              document.getElementById('ov').replaceChildren(el('p', 'ov-empty', words().error));
              fit(Homey);
            });
        }
        // ready() without a height puts the widget back to its compose height: the fit done while
        // loading would be lost, and a long card clipped (Plan vs actual, 2026-11-21).
        // The last picture this card showed, drawn at once while the app is asked: the dashboard
        // opens without waiting on the app, and the answer replaces it a moment later.
        var shown = false;
        try {
          var kept = JSON.parse(localStorage.getItem(cacheKey) || 'null');
          if (kept && Date.now() - kept.at < KEEP_MS) { last = kept.data; render(kept.data); Homey.ready({height: Math.ceil(document.getElementById('ov').scrollHeight) + 16}); shown = true; }
        } catch (e) { /* no storage: wait for the app, as before */ }
        load().finally(function () { if (!shown) Homey.ready({height: Math.ceil(document.getElementById('ov').scrollHeight) + 16}); });
        setInterval(load, 60000);
      }
    </script>
  </body>
</html>
