<html>
  <head>
    <style>
      .tk { padding: var(--homey-su-2, 8px) var(--homey-su-3, 12px); }
      .tk-title { opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tk-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
      .tk-chip { font-size: 0.8em; padding: 2px 8px; border-radius: 999px; background: transparent; border: 1px solid rgba(127, 127, 127, 0.4); opacity: 0.75; }
      .tk-status { text-wrap: balance; margin: 12px 0 0; font-size: 1.35em; font-weight: 600; }
      .tk-reason { margin: 4px 0 0; opacity: 0.85; }
      .tk-chart { display: block; margin-top: 14px; overflow: visible; }
      .tk-chart text { font-size: 11px; fill: currentColor; opacity: 0.75; }
      .tk-chart text.axis-title { font-size: 10.5px; opacity: 0.6; }
      .tk-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8em; opacity: 0.9; margin-top: 10px; }
      .tk-key { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-sizing: border-box; }
      .tk-key.line { height: 3px; border-radius: 2px; vertical-align: 3px; }
      .tk-empty { opacity: 0.8; margin: 12px 0; }
      .skel { fill: currentColor; fill-opacity: 0.06; }
      .ghost-line { fill: none; stroke: var(--tk-tank); stroke-opacity: 0.35; stroke-width: 2.2; stroke-linecap: round; }
      .ghost-bar { fill: currentColor; fill-opacity: 0.1; }
      @media (prefers-reduced-motion: no-preference) {
        .ghost-line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ghost-draw 4.2s cubic-bezier(.45, 0, .25, 1) infinite; }
        .ghost-bar { transform-box: fill-box; transform-origin: center bottom; animation: ghost-rise 4.2s cubic-bezier(.3, 0, .2, 1) infinite both; }
      }
      @keyframes ghost-draw { 0% { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } 55% { stroke-dashoffset: 0; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes ghost-rise { 0%, 35% { transform: scaleY(0); opacity: 0; } 55%, 85% { transform: scaleY(1); opacity: 1; } 100% { opacity: 0; } }
      /* The tank and its charges in blue (the plan widget's charge colour), use in violet. */
      :root { --tk-tank: #2d6bd6; --tk-done: rgba(45, 107, 214, 0.35); --tk-use: #7652d6; }
      :root[data-theme="dark"] { --tk-tank: #4da3ff; --tk-done: rgba(77, 163, 255, 0.35); --tk-use: #a48cff; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --tk-tank: #4da3ff; --tk-done: rgba(77, 163, 255, 0.35); --tk-use: #a48cff; }
      }
    </style>
  </head>

  <body class="homey-widget">
    <div class="tk" id="tk"></div>

    <script type="text/javascript">
      var NS = 'http://www.w3.org/2000/svg';
      // Used only when the app cannot be reached at all, so it cannot send a translated line.
      var FALLBACK = {
        en: {loading: 'Loading…', error: 'Couldn’t load this widget. Trying again in a minute.'},
        sv: {loading: 'Laddar…', error: 'Det gick inte att läsa in widgeten. Försöker igen om en minut.'},
        nl: {loading: 'Laden…', error: 'Kon de widget niet laden. Over een minuut probeer ik het opnieuw.'},
        de: {loading: 'Lädt…', error: 'Das Widget konnte nicht geladen werden. Neuer Versuch in einer Minute.'},
        no: {loading: 'Laster…', error: 'Kunne ikke laste widgeten. Prøver igjen om et minutt.'},
        da: {loading: 'Indlæser…', error: 'Kunne ikke indlæse widgetten. Prøver igen om et minut.'}
      };
      function words() {
        var lang = String((navigator.language || 'en')).slice(0, 2).toLowerCase();
        if (lang === 'nb' || lang === 'nn') lang = 'no';
        return FALLBACK[lang] || FALLBACK.en;
      }
      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function svgEl(tag, attrs, text) {
        var n = document.createElementNS(NS, tag);
        Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function nums(list) { return list.filter(function (v) { return typeof v === 'number'; }); }
      function fmt(v, decimals) { return (Math.round(v * 100) / 100).toFixed(decimals); }

      // Light or dark, from the text colour Homey gives the page: light text means a dark card.
      function applyTheme() {
        var rgb = (getComputedStyle(document.body).color.match(/[\d.]+/g) || []).map(Number);
        if (rgb.length < 3) return;
        document.documentElement.setAttribute('data-theme', (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.5 ? 'dark' : 'light');
      }

      // The chart is drawn at its real pixel width, so its text stays 11 px on any card.
      function chartWidth() {
        var tk = document.getElementById('tk'), cs = getComputedStyle(tk);
        return Math.max(240, Math.floor(tk.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
      }

      // A smooth curve through points, monotone cubic (no overshoot), as on the help pages.
      function monotone(pts) {
        var n = pts.length;
        if (!n) return '';
        var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
        if (n < 2) return d;
        var dx = [], m = [], s = [], i;
        for (i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / dx[i]; }
        s[0] = m[0]; s[n - 1] = m[n - 2];
        for (i = 1; i < n - 1; i++) s[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
        for (i = 0; i < n - 1; i++) {
          if (m[i] === 0) { s[i] = 0; s[i + 1] = 0; continue; }
          var a = s[i] / m[i], b = s[i + 1] / m[i], h = a * a + b * b;
          if (h > 9) { var tau = 3 / Math.sqrt(h); s[i] = tau * a * m[i]; s[i + 1] = tau * b * m[i]; }
        }
        for (i = 0; i < n - 1; i++)
          d += 'C' + (pts[i][0] + dx[i] / 3).toFixed(1) + ' ' + (pts[i][1] + s[i] * dx[i] / 3).toFixed(1) + ' '
            + (pts[i + 1][0] - dx[i] / 3).toFixed(1) + ' ' + (pts[i + 1][1] - s[i + 1] * dx[i] / 3).toFixed(1) + ' '
            + pts[i + 1][0].toFixed(1) + ' ' + pts[i + 1][1].toFixed(1);
        return d;
      }
      // Runs of consecutive slots that have a value: [[first, last], ...].
      function runs(slots, pick) {
        var out = [], from = -1;
        slots.forEach(function (s, k) {
          var has = typeof pick(s) === 'number';
          if (has && from < 0) from = k;
          if (!has && from >= 0) { out.push([from, k - 1]); from = -1; }
        });
        if (from >= 0) out.push([from, slots.length - 1]);
        return out;
      }

      // The hours under a chart. An hour never touches its neighbour: text is about 6.2 px a character.
      function hours(svg, ticks, y) {
        var CHAR = 6.2, edge = -1e9;
        ticks.forEach(function (t) {
          var half = t.label.length * CHAR / 2;
          if (t.x - half < edge + 8) return;
          svg.appendChild(svgEl('text', {x: t.x, y: y, 'text-anchor': 'middle'}, t.label));
          edge = t.x + half;
        });
      }


      // Starting: a tank line draws itself and use bars rise, so the card keeps its size.
      function placeholder(height) {
        var W = chartWidth(), H = height, T = 22, B = H - 60, svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'tk-chart', role: 'img'});
        [T, (T + B) / 2, B].forEach(function (y) { svg.appendChild(svgEl('line', {x1: 0, x2: W, y1: y, y2: y, stroke: 'currentColor', 'stroke-opacity': 0.07})); });
        var d = '';
        for (var i = 0; i <= 60; i++) { var t = i / 60, y = T + (B - T) * (0.25 + 0.5 * (t % 0.34) / 0.34); d += (i ? 'L' : 'M') + (W * t).toFixed(1) + ' ' + y.toFixed(1); }
        svg.appendChild(svgEl('path', {d: d, class: 'ghost-line', pathLength: 1}));
        for (var k = 0; k < 24; k++) {
          var h = 4 + 26 * Math.abs(Math.sin(k * 1.3)) * (k % 5 === 2 ? 1 : 0.35);
          var bar = svgEl('rect', {x: W * k / 24 + 2, y: H - 8 - h, width: W / 24 - 4, height: h, rx: 2, class: 'ghost-bar'});
          bar.style.animationDelay = (k * 0.04) + 's';
          svg.appendChild(bar);
        }
        return svg;
      }

      // The tank in litres of 40 °C water (read solid, planned dashed) over a dashed floor at what is
      // always kept; the charges as bands under it; the use per hour (drawn filled, expected
      // outlined) below that; the hours.
      var clips = 0;
      function tankChart(data) {
        var W = chartWidth(), L = 34, R = W - 6, PH = Math.max(100, Math.min(150, Math.round(W * 0.33))) + EXTRA, B = TOP + PH;
        var bands = data.bands || [], bandY = B + 8, useTop = bandY + (bands.length ? 34 : 6), UH = 40, useB = useTop + UH;
        var tickY = useB + 16, H = tickY + 6;
        var n = data.slots.length, step = (R - L) / n;
        var svg = svgEl('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, class: 'tk-chart', role: 'img'});
        var y = function (v) { return B - PH * v / data.max; };
        var x = function (k) { return L + k * step; };
        if (data.axis) svg.appendChild(svgEl('text', {x: 0, y: 11, class: 'axis-title'}, data.axis));
        (data.gridlines || []).forEach(function (v) {
          svg.appendChild(svgEl('line', {x1: L, x2: R, y1: y(v), y2: y(v), stroke: 'currentColor', 'stroke-opacity': 0.1}));
          svg.appendChild(svgEl('text', {x: L - 5, y: y(v) + 4, 'text-anchor': 'end'}, String(v)));
        });
        if (typeof data.reserve === 'number')
          svg.appendChild(svgEl('line', {x1: L, x2: R, y1: y(data.reserve), y2: y(data.reserve), stroke: 'currentColor', 'stroke-opacity': 0.45, 'stroke-dasharray': '2 3'}));
        function line(pick, dashed) {
          runs(data.slots, pick).forEach(function (r) {
            var p = [];
            for (var k = r[0]; k <= r[1]; k++) p.push([x(k) + step / 2, y(pick(data.slots[k]))]);
            svg.appendChild(svgEl('path', {d: monotone(p), fill: 'none', stroke: 'var(--tk-tank)', 'stroke-width': dashed ? 2 : 2.2,
              'stroke-linecap': 'round', 'stroke-dasharray': dashed ? '4 4' : 'none'}));
          });
        }
        line(function (s) { return s.read; }, false);
        line(function (s) { return s.plan; }, true);
        if (typeof data.now === 'number')
          svg.appendChild(svgEl('line', {x1: x(data.now), x2: x(data.now), y1: TOP - 8, y2: useB, stroke: 'currentColor', 'stroke-opacity': 0.4}));
        // Charges: done muted, planned full, as on the plan widget.
        var edge = L - 100;
        bands.forEach(function (b) {
          var bx = x(b.from), bw = Math.max(x(b.to) - bx, 6), bh = 12, id = 'tkclip' + (++clips);
          var dx = typeof b.doneTo === 'number' ? Math.min(bx + bw, x(b.doneTo)) : bx;
          svg.appendChild(svgEl('defs', {})).innerHTML = '<clipPath id="' + id + '"><rect x="' + bx + '" y="' + bandY + '" width="' + bw + '" height="' + bh + '" rx="5"/></clipPath>';
          var g = svgEl('g', {'clip-path': 'url(#' + id + ')'});
          if (dx > bx) g.appendChild(svgEl('rect', {x: bx, y: bandY, width: dx - bx, height: bh, fill: 'var(--tk-done)'}));
          if (bx + bw > dx) g.appendChild(svgEl('rect', {x: dx, y: bandY, width: bx + bw - dx, height: bh, fill: 'var(--tk-tank)'}));
          svg.appendChild(g);
          var half = b.label.length * 3.1, cx = Math.min(R - half, Math.max(L + half, bx + bw / 2));
          if (cx - half < edge + 8) return;
          svg.appendChild(svgEl('text', {x: cx, y: bandY + bh + 13, 'text-anchor': 'middle'}, b.label));
          edge = cx + half;
        });
        // Use per hour: drawn filled, expected as an outline behind it, on their own scale.
        var hrs = data.hours || [], top = Math.max(50, Math.max.apply(null, hrs.map(function (h) { return Math.max(h.forecast || 0, h.drawn || 0); }).concat([0])));
        var hw = 4 * step;
        svg.appendChild(svgEl('text', {x: L - 5, y: useTop + 8, 'text-anchor': 'end'}, String(Math.round(top))));
        svg.appendChild(svgEl('line', {x1: L, x2: R, y1: useB, y2: useB, stroke: 'currentColor', 'stroke-opacity': 0.15}));
        hrs.forEach(function (h, i) {
          var bx = x(4 * i) + 1.5, bw = Math.max(hw - 3, 2);
          if (h.forecast > 0) {
            var fh = Math.max(UH * h.forecast / top, 1.5);
            svg.appendChild(svgEl('rect', {x: bx + 0.5, y: useB - fh + 0.5, width: bw - 1, height: fh - 0.5, rx: 2, fill: 'none', stroke: 'var(--tk-use)', 'stroke-opacity': 0.7, 'stroke-width': 1}));
          }
          if (typeof h.drawn === 'number' && h.drawn > 0) {
            var dh = Math.max(UH * h.drawn / top, 1.5);
            svg.appendChild(svgEl('rect', {x: bx, y: useB - dh, width: bw, height: dh, rx: 2, fill: 'var(--tk-use)'}));
          }
        });
        hours(svg, data.ticks.map(function (t) { return {x: x(t.at), label: t.label}; }), tickY);
        return svg;
      }

      function legend(items) {
        var box = el('div', 'tk-legend');
        items.forEach(function (i) {
          if (!i.text) return;
          var item = el('span'); var key = el('span', 'tk-key' + (i.line ? ' line' : ''));
          key.style.cssText = i.style;
          item.appendChild(key); item.appendChild(document.createTextNode(i.text)); box.appendChild(item);
        });
        return box;
      }

      var TOP = 22, EXTRA = 0;
      function cardTarget() { return Math.max(340, Math.min(560, Math.round(150 + chartWidth() * 0.78))); }
      function renderFitted(data) {
        EXTRA = 0;
        render(data);
        if (data.empty) return;
        var gap = cardTarget() - document.getElementById('tk').scrollHeight;
        if (gap > 4) { EXTRA = gap; render(data); }
      }

      var last = null;
      function fit(Homey) {
        if (Homey && Homey.setHeight) Homey.setHeight(Math.ceil(document.getElementById('tk').scrollHeight) + 16);
      }

      function render(data) {
        applyTheme();
        var root = document.getElementById('tk');
        root.replaceChildren();
        if (data.title) root.appendChild(el('div', 'tk-title homey-text-small', data.title));
        if (!data.empty && data.badge) {
          var row = el('div', 'tk-chips');
          row.appendChild(el('span', 'tk-chip', data.badge));
          root.appendChild(row);
        }
        if (data.empty) { root.appendChild(el('p', 'tk-empty', data.empty)); return; }
        if (data.status) root.appendChild(el('p', 'tk-status', data.status));
        if (data.reason) root.appendChild(el('p', 'tk-reason homey-text-small', data.reason));
        if (data.loading && !(data.slots && data.slots.length)) {
          root.appendChild(placeholder(Math.max(100, Math.min(150, Math.round(chartWidth() * 0.33))) + 110 + EXTRA));
          return;
        }
        if (!(data.slots && data.slots.length)) return;
        root.appendChild(tankChart(data));
        var lg = data.legend || {};
        root.appendChild(legend([
          {text: lg.read, line: true, style: 'background: var(--tk-tank);'},
          {text: lg.plan, line: true, style: 'background: repeating-linear-gradient(90deg, var(--tk-tank) 0 4px, transparent 4px 7px);'},
          {text: lg.reserve, line: true, style: 'background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px); opacity: 0.6;'},
          {text: lg.done, style: 'background: var(--tk-done);'},
          {text: lg.charge, style: 'background: var(--tk-tank);'},
          {text: lg.drawn, style: 'background: var(--tk-use);'},
          {text: lg.forecast, style: 'border: 1px solid var(--tk-use);'}]));
      }

      function onHomeyReady(Homey) {
        var settings = Homey.getSettings() || {};
        var device = settings.device && settings.device.id;
        document.getElementById('tk').appendChild(el('p', 'tk-empty', words().loading));
        function show(data) { failures = 0; last = data; renderFitted(data); fit(Homey); }
        var failures = 0;
        function load() {
          return Homey.api('GET', '/' + (device ? '?device=' + encodeURIComponent(device) : ''), {})
            .then(show)
            .catch(function (err) {
              if (typeof console !== 'undefined') console.error(err);
              if (last) return; // keep the last good picture until the app answers again
              // An install or a restart leaves the app unreachable for a minute or two: keep saying
              // "Loading…" and try every 30 s, and call it an error only after two minutes of that.
              if (++failures < 5) { setTimeout(load, 30000); return; }
              // The app answers its own problems with a translated line, so a rejection is the network.
              var text = words().error;
              document.getElementById('tk').replaceChildren(el('p', 'tk-empty', text));
              fit(Homey);
            });
        }
        load().finally(function () { Homey.ready(); });
        setInterval(load, 60000);
        // The card changes width: draw the chart again at the new width.
        var timer = null;
        window.addEventListener('resize', function () {
          clearTimeout(timer);
          timer = setTimeout(function () { if (last) { renderFitted(last); fit(Homey); } }, 150);
        });
      }
    </script>
  </body>
</html>
