name: CI

# The gate the repo did not have. `npm run lint` is not in it on purpose: the codebase is
# 4-space and eslint-config-athom wants 2, so it fails repo-wide on untouched files and is not a
# signal on a change (see CLAUDE.md). Types and tests are.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not 18, which is what Homey Pro (Early 2023) runs. That pin looked like it verified the
      # app against the real runtime, but it never did: these tests exercise our own code against
      # an in-process fake pump, not Node-version behaviour. What it actually bought was 18
      # failing tests — the tsx + node:test harness breaks on 18, while all 88 unit tests pass —
      # so CI sat red from 1.1.1 (2026-08-16) through 1.1.4, five releases nobody was warned
      # about, because a permanently red gate is one you stop reading.
      #
      # Real Node 18 compatibility is confirmed continuously and for free: every user diagnostic
      # report is the app running on a Homey Pro. That is better evidence than this job could
      # produce, so it does not need to try.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The app bundle. tsconfig.json excludes test/, so this is the code that ships.
      - name: Type-check the app
        run: npx tsc --noEmit

      # The suite itself. `npm test` runs through tsx, which strips types without checking them,
      # so nothing else would ever catch a type error in test/.
      - name: Type-check the tests
        run: npx tsc -p tsconfig.test.json

      - name: Test
        run: npm test

      # Catches anything that makes the manifest unpublishable — an orphan capability instance,
      # a malformed flow card, a missing translation — before a release does. Pinned rather than
      # `npx homey@latest` so a CLI release cannot fail the build on its own schedule.
      - name: Validate the app manifest
        run: npx --yes homey@4.4.1 app validate --level publish
