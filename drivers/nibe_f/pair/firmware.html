<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../assets/pair/pair.css">
</head>
<body>

<div class="pair-hero">
    <div class="firmware-art" aria-hidden="true">
        <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
            <rect class="fw-body" x="14" y="10" width="64" height="82" rx="8"/>
            <rect class="fw-screen" x="24" y="20" width="44" height="26" rx="4"/>
            <path class="fw-screen-lines" d="M31 29h18M31 37h28"/>
            <path class="fw-vents" d="M28 60h36M28 68h36M28 76h36"/>
            <circle class="fw-badge" cx="88" cy="70" r="20"/>
            <path class="fw-arrow" d="M88 80V60M80 67l8-8 8 8"/>
        </svg>
    </div>
    <div class="pair-hero-title" data-i18n="pair.firmware.title"></div>
    <p class="pair-hero-sub" data-i18n="pair.firmware.intro"></p>
</div>

<div class="firmware-options" id="options-s">
    <div class="firmware-option">
        <span class="pump-glyph"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M30 72h44a16 16 0 0 0 0-32 24 24 0 0 0-46-4 18 18 0 0 0 2 36z"/><path d="M52 64V44M44 51l8-8 8 8"/></svg></span>
        <div>
            <strong data-i18n="pair.firmware.online_title"></strong>
            <p class="firmware-detail" data-i18n="pair.firmware.online_body"></p>
        </div>
    </div>
    <div class="firmware-option">
        <span class="pump-glyph"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="40" width="32" height="50" rx="6"/><path d="M40 40V14h20v26"/><path d="M45 24h3M52 24h3"/></svg></span>
        <div>
            <strong data-i18n="pair.firmware.usb_title"></strong>
            <p class="firmware-detail" data-i18n="pair.firmware.usb_body"></p>
        </div>
    </div>
</div>

<div class="firmware-options" id="options-f" hidden>
    <div class="firmware-option">
        <span class="pump-glyph"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="34" y="40" width="32" height="50" rx="6"/><path d="M40 40V14h20v26"/><path d="M45 24h3M52 24h3"/></svg></span>
        <div>
            <strong data-i18n="pair.firmware.f_title"></strong>
            <p class="firmware-detail" data-i18n="pair.firmware.f_body"></p>
        </div>
    </div>
</div>

<p class="firmware-note" data-i18n="pair.firmware.note"></p>

<form class="homey-form">
    <button class="homey-button-primary-full" id="continue" data-i18n="pair.firmware.continue"></button>
</form>

<script src="../../../assets/pair/firmware.js"></script>
</body>
</html>
