<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../assets/pair/pair.css">
</head>
<body>

<div class="pair-hero">
    <div class="pair-hero-icon pair-hero-icon--search"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="43" cy="43" r="24"/><line x1="60" y1="60" x2="80" y2="80"/></svg></div>
    <div class="pair-hero-title" data-i18n="pair.discover.title"></div>
    <p class="pair-hero-sub detect-status" id="discovery-status"></p>
</div>

<div class="detect-progress" id="progress" style="display: none"><div class="detect-bar" id="discovery-bar"></div></div>

<div id="gateway-settings" hidden class="homey-form">
    <p data-i18n="pair.gateway.hint"></p>
    <div class="homey-form-group"><label for="gateway-type" data-i18n="pair.gateway.type"></label><select class="homey-form-select" id="gateway-type"></select></div>
    <div class="homey-form-group"><label for="gateway-port" data-i18n="pair.gateway.port"></label><input class="homey-form-input" id="gateway-port" type="number" min="1" max="65535" value="502"></div>
    <div class="homey-form-group"><label for="gateway-unit" data-i18n="pair.gateway.unit"></label><input class="homey-form-input" id="gateway-unit" type="number" min="1" max="247" value="1"></div>
</div>

<div id="pump-list" class="pump-list"></div>

<div class="detect-actions">
    <a href="#" id="refresh" class="pair-link" style="display: none" data-i18n="pair.discover.refresh"></a>
</div>

<details id="manual" class="pair-manual">
    <summary data-i18n="pair.discover.manual"></summary>
    <form class="homey-form">
        <div class="homey-form-group">
            <input class="homey-form-input" id="ipaddress" type="text" maxlength="15" placeholder="192.168.1.100">
        </div>
        <button class="homey-button-primary-full" id="submit" data-i18n="pair.ok"></button>
    </form>
</details>

<script src="../../../assets/pair/ip-address.js"></script>
</body>
</html>
